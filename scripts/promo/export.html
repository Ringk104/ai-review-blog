<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>export</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&display=swap">
<style>body{margin:0;padding:16px;background:#0B1220;color:#E6EDF5;font:14px/1.6 system-ui,sans-serif}canvas{width:270px;height:auto;display:block}#log{white-space:pre-wrap;color:#94A3B8}</style></head>
<body><canvas id="c"></canvas><div id="status">준비 중</div><div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="render.js"></script>
<script>
;(async function () {
  // 영상만(소리 없음): render.js 를 프레임마다 그려 H.264 MP4 로 묶어 /save 에 저장. 끝나면 포스터 PNG 도 저장
  const q = new URLSearchParams(location.search)
  const OW = +q.get('w') || 1080, OH = +q.get('h') || 1920, VB = +q.get('vb') || 5_000_000
  const NAME = q.get('name') || 'out.mp4'
  const st = document.getElementById('status'), lg = document.getElementById('log')
  const set = (s) => { st.textContent = s; document.title = s }
  const log = (s) => { lg.textContent += s + '\n' }
  try {
    const R = window.FVPromo, fps = 30, total = Math.round(R.DURATION * fps)
    let codec = null
    for (const c of ['avc1.640033', 'avc1.640028', 'avc1.4d0028', 'avc1.420028']) {
      const s = await VideoEncoder.isConfigSupported({ codec: c, width: OW, height: OH, bitrate: VB, framerate: fps })
      if (s.supported) { codec = c; break }
    }
    if (!codec) throw new Error('H.264 인코딩 미지원')
    log(`video ${OW}x${OH} ${codec} ${VB / 1e6}Mbps`)
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: OW, height: OH, frameRate: fps }, fastStart: 'in-memory', firstTimestampBehavior: 'offset' })
    let err = null
    const cv = document.getElementById('c'); cv.width = OW; cv.height = OH
    const ctx = cv.getContext('2d')
    await R.loadFonts(document, 15000)
    const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => { err = e } })
    enc.configure({ codec, width: OW, height: OH, bitrate: VB, framerate: fps, avc: { format: 'avc' } })
    for (let i = 0; i < total; i++) {
      if (err) throw err
      ctx.setTransform(OW / R.W, 0, 0, OH / R.H, 0, 0)
      R.render(ctx, i / fps)
      const fr = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) })
      enc.encode(fr, { keyFrame: i % (fps * 2) === 0 }); fr.close()
      while (enc.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 4))
      if (i % fps === 0) set(`인코딩 ${i}/${total}`)
    }
    await enc.flush(); if (err) throw err
    muxer.finalize()
    const buf = muxer.target.buffer
    let r = await fetch('/save?name=' + encodeURIComponent(NAME), { method: 'POST', body: buf })
    if (!r.ok) throw new Error('저장 실패 ' + r.status)
    // 포스터: 브랜드 장면(26초)
    ctx.setTransform(OW / R.W, 0, 0, OH / R.H, 0, 0); R.render(ctx, 25.5)
    const png = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.88))
    await fetch('/save?name=' + encodeURIComponent(NAME.replace(/\.mp4$/, '-poster.jpg')), { method: 'POST', body: png })
    set(`완료 ${NAME} · ${(buf.byteLength / 1048576).toFixed(1)}MB`)
  } catch (e) { set('오류: ' + (e && e.message ? e.message : e)) }
})()
</script></body></html>
