baseURL = "https://viewit.co.kr/"
languageCode = "ko"
title = "ViewIt - AI 리뷰 분석"
theme = "PaperMod"
defaultContentLanguage = "ko"
paginate = 10
googleAnalytics = "G-3B1TS6JL55"

# 미래 날짜 글도 빌드 포함 (주간 발행 큐 선공개용)
buildFuture = true

# robots.txt 자동 생성 (검색엔진 크롤러 유도)
enableRobotsTXT = true

[params]
  env = "production"
  description = "AI가 분석한 실구매자 리뷰, 한눈에 보는 제품 비교"
  author = "ViewIt"
  ShowReadingTime = false
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowToc = true
  # 목차를 펼친 상태로 노출 — 스크롤 없이 원하는 섹션으로 점프 유도
  # (세션당 페이지뷰·체류시간 개선 목적, 2026-07)
  TocOpen = true
  ShowCodeCopyButtons = true
  defaultTheme = "auto"
  images = ["cover.png"]

  # 홈은 layouts/index.html 로 직접 만든다 (2026-08-10 콘텐츠 허브)
  #   profileMode 는 로고·소개문·버튼뿐이라 글이 하나도 안 보였다.
  [params.profileMode]
    enabled = false
    title = "ViewIt"
    subtitle = "광고 문구 말고, 실제 사용자 목소리 먼저 보세요.\n수백 개 실구매 리뷰를 AI가 분석해 진짜 장단점만 정리합니다."
    imageUrl = "/images/logo.svg"
    imageWidth = 140
    imageHeight = 140

    [[params.profileMode.buttons]]
      name = "추천·비교"
      url = "/categories/추천비교/"

    [[params.profileMode.buttons]]
      name = "구매 가이드"
      url = "/categories/구매가이드/"

    [[params.profileMode.buttons]]
      name = "문제해결"
      url = "/categories/문제해결/"

  # 소셜 아이콘 (현재 비활성)
  # RSS는 사용자가 클릭하면 XML이 노출되어 혼란스러우므로 제거
  # [[params.socialIcons]]
  #   name = "rss"
  #   url = "/index.xml"

  # 검색 기능
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  # 글 목록에 설명 표시
  [params.cover]
    hiddenInList = false
    hiddenInSingle = false

  # 글 하단 "이전/다음" 네비게이션 활성화
  ShowPostNavLinks = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  # 태그·카테고리 페이지의 RSS 출력 제거 (2026-08-03)
  #   태그마다 index.xml 이 생성돼 구글이 216개를 계속 크롤링했다.
  #   GSC '크롤링됨 - 색인 안 됨' 16건이 전부 이 피드였고, 크롤링 예산이
  #   글이 아니라 껍데기 피드로 새고 있었다.
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5

# 관련 글 자동 추출 설정 (본문 하단 "관련 글 더보기")
# tags 일치가 가장 높은 가중치, categories, 최신순 보조
[related]
  includeNewer = true
  threshold = 60        # 0~100. 낮을수록 관대하게 매칭
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 60

  [[related.indices]]
    name = "date"
    weight = 10

# 상단 메뉴
[menu]
  [[menu.main]]
    identifier = "home"
    name = "홈"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "posts"
    name = "전체 글"
    url = "/posts/"
    weight = 2

  # 5개 유형별 카테고리 (2026-07 재편) — 독자가 목적별로 찾도록
  [[menu.main]]
    identifier = "roundup"
    name = "추천·비교"
    url = "/categories/추천비교/"
    weight = 3

  [[menu.main]]
    identifier = "guide"
    name = "구매가이드"
    url = "/categories/구매가이드/"
    weight = 4

  [[menu.main]]
    identifier = "troubleshoot"
    name = "문제해결"
    url = "/categories/문제해결/"
    weight = 5

  [[menu.main]]
    identifier = "review"
    name = "제품리뷰"
    url = "/categories/제품리뷰/"
    weight = 6

  [[menu.main]]
    identifier = "new"
    name = "신제품"
    url = "/categories/신제품소식/"
    weight = 7

  [[menu.main]]
    identifier = "search"
    name = "검색"
    url = "/search/"
    weight = 8


