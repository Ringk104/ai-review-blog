<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">도크에 올라가는데 충전이 안 되면</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="24" y="36" width="50" height="70" rx="8" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><circle cx="42" cy="62" r="4" fill="#1E293B"/><circle cx="56" cy="62" r="4" fill="#1E293B"/><path d="M74,84 q50,0 60,30 q8,24 42,20" stroke="#1E293B" stroke-width="4" fill="none"/><rect x="174" y="112" width="44" height="44" rx="6" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M30,122 l10,10 l18,-20 M180,170 l10,10 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="206" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">① 전원선 양쪽 끝</text><text x="120" y="234" text-anchor="middle" font-size="14" fill="#475569">콘센트 쪽·도크 쪽 모두</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="70" y="40" width="100" height="120" rx="12" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="72" r="10" fill="#2563EB"/><path d="M120,52 v-6 M102,58 l-5,-5 M138,58 l5,-5" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><text x="120" y="206" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">② 도크 표시등</text><text x="120" y="234" text-anchor="middle" font-size="14" fill="#475569">전원 들어오면 켜짐 · 충전 중엔 꺼짐</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="40" y="74" width="160" height="60" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="64" y="94" width="30" height="14" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><rect x="146" y="94" width="30" height="14" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><path d="M100,44 l40,-10 l8,24 l-40,10 z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><path d="M24,150 l14,14 M38,150 l-14,14" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/><text x="46" y="163" font-size="14" fill="#EF4444" font-weight="800">물티슈·젖은 천·젖은 손 안 됨</text><text x="120" y="206" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">③ 충전 단자 닦기</text><text x="120" y="234" text-anchor="middle" font-size="14" fill="#475569">부드럽고 마른 천으로</text></g></svg>