<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="330" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">로보락이 도크로 안 돌아올 때 — 이 순서로</text>
<g transform="translate(24,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">1</text>
<rect x="60" y="52" width="50" height="62" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="72" y="64" width="26" height="9" rx="3" fill="#2563EB"/><circle cx="85" cy="104" r="18" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="85" cy="95" r="5" fill="#1E293B"/><path d="M112,96 h40 m-12,-10 l12,10 l-12,10" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">도크에서 출발</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">시키기</text><text x="16" y="214" font-size="15" fill="#475569">청소 중 도크 옮기지 않기</text></g>
<g transform="translate(216,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">2</text>
<rect x="50" y="46" width="120" height="8" fill="#475569"/><rect x="88" y="54" width="44" height="30" rx="6" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M110,90 v28 m-9,-9 l9,9 l9,-9" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,124 h100" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5"/>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">도크는 벽에 붙이고</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">앞쪽 비우기</text><text x="16" y="214" font-size="15" fill="#475569">카펫·매트 위는 피하기</text></g>
<g transform="translate(408,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">3</text>
<rect x="66" y="50" width="56" height="66" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="74" y="92" width="40" height="12" rx="4" fill="#1E293B"/><path d="M128,98 q10,-6 0,-12 M136,104 q18,-12 0,-24" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M120,58 l28,-8 l6,18 l-28,8 z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">도크 신호부와</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">로봇 앞 센서 닦기</text><text x="16" y="214" font-size="15" fill="#475569">부드럽고 마른 천으로</text></g>
<g transform="translate(600,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">4</text>
<rect x="40" y="54" width="110" height="56" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="58" y="72" width="22" height="12" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><rect x="110" y="72" width="22" height="12" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><path d="M96,34 l34,-9 l7,20 l-34,9 z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">충전이 안 되면</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">충전 단자 닦기</text><text x="16" y="214" font-size="15" fill="#475569">물티슈·젖은 천 금지</text></g>
</svg>