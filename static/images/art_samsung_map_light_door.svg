<path d="M110,130 l-50,22 v160 l50,-22 z" fill="#DBEAFE" stroke="#1E293B" stroke-width="4"/>
<path d="M290,104 v20" stroke="#1E293B" stroke-width="3"/><path d="M266,124 h48 l-8,18 h-32 z" fill="#FDE68A" stroke="#1E293B" stroke-width="3"/>
<path d="M290,152 l-36,120 M290,152 l36,120" stroke="#FDE68A" stroke-width="4" opacity="0.9"/>
<rect x="230" y="258" width="76" height="28" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
<text x="200" y="332" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">방문 열고 불 켜기 ○</text>
<rect x="520" y="130" width="96" height="160" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/><circle cx="600" cy="214" r="6" fill="#1E293B"/>
