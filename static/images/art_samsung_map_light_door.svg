<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">맵 그리기 전에 — 문 열고, 불 켜고</text>
<text x="400" y="82" text-anchor="middle" font-size="20" fill="#475569">맵에 넣을 방은 열어 두고 밝게, 턱이 높은 문은 닫아 둔다</text>
