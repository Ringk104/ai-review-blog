<text x="664" y="290" font-size="18" font-weight="800" fill="#2563EB">높은 턱</text>
<text x="600" y="332" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">턱 높은 문은 닫기 ○</text></svg>
