<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="330" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">특정 구역을 청소하지 않을 때 — 이 순서로</text>
<g transform="translate(24,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">1</text>
<rect x="40" y="50" width="120" height="80" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M100,50 v34 M100,106 v24 M40,90 h40" stroke="#1E293B" stroke-width="3"/><rect x="104" y="96" width="50" height="30" fill="#DBEAFE" opacity=".8"/><text x="160" y="62" text-anchor="middle" font-size="22" font-weight="800" fill="#EF4444">?</text>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">지도 만들 때와</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">지금이 같은지</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">문·가구·충전대 위치</text></g>
<g transform="translate(216,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">2</text>
<rect x="40" y="50" width="120" height="80" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M100,50 v34 M100,106 v24 M40,90 h40" stroke="#1E293B" stroke-width="3"/><rect x="46" y="56" width="48" height="30" fill="#FECACA" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 3"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">금지 구역·</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">가상벽 확인</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">너무 가깝게 그리지 않기</text></g>
<g transform="translate(408,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">3</text>
<rect x="80" y="60" width="40" height="50" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="100" cy="74" r="5" fill="#2563EB"/><path d="M60,60 v60 M150,60 v60" stroke="#475569" stroke-width="5"/><path d="M130,40 l14,14 M144,40 l-14,14" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">충전대 자리</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B"></text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">통로·방문 근처 피하기</text></g>
<g transform="translate(600,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">4</text>
<circle cx="70" cy="100" r="22" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="70" cy="89" r="7" fill="#1E293B"/><rect x="110" y="70" width="10" height="50" fill="#1E293B"/><rect x="134" y="70" width="10" height="50" fill="#1E293B"/><path d="M104,124 q30,-14 60,0" stroke="#F59E0B" stroke-width="3" fill="none"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">가는 길의</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">장애물 치우기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">의자·전선·빨래 건조대</text></g>
</svg>