<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">공유기·비밀번호를 바꿨다면 — 지우고 다시 등록</text>
<text x="400" y="78" text-anchor="middle" font-size="20" fill="#475569">로봇은 처음 등록할 때의 와이파이를 기억하고 있다</text>
<g transform="translate(30,100)"><rect width="230" height="230" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="18" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">1</text>
<rect x="55" y="54" width="150" height="70" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"/><text x="130" y="84" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">로봇청소기</text><text x="130" y="110" text-anchor="middle" font-size="16" fill="#94A3B8">오프라인</text>
<circle cx="180" cy="120" r="14" fill="#38BDF8" opacity="0.6"/><circle cx="180" cy="120" r="24" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6"/>
<text x="115" y="170" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">카드를</text><text x="115" y="200" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">3초간 누르기</text></g>
<g transform="translate(285,100)"><rect width="230" height="230" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="18" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">2</text>
<rect x="55" y="66" width="120" height="46" rx="23" fill="#B45309"/><text x="115" y="96" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">삭제</text>
<text x="115" y="170" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">뜨는 창에서</text><text x="115" y="200" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">삭제</text></g>
<g transform="translate(540,100)"><rect width="230" height="230" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="18" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">3</text>
<path d="M96,84 v-24 M134,84 v-24" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/><rect x="80" y="84" width="70" height="40" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><circle cx="102" cy="104" r="5" fill="#2563EB"/><circle cx="120" cy="104" r="5" fill="#2563EB"/>
<path d="M162,74 A20,20 0 0 1 162,114" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M174,62 A36,36 0 0 1 174,126" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
<text x="115" y="170" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">새 와이파이로</text><text x="115" y="200" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">다시 등록</text></g>
<path d="M262,215 h20" stroke="#2563EB" stroke-width="4"/><path d="M517,215 h20" stroke="#2563EB" stroke-width="4"/>
<text x="400" y="360" text-anchor="middle" font-size="18" fill="#475569">삼성 스마트싱스 기준 · 등록 방법은 모델마다 다르다</text></svg>
