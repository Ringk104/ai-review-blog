<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">봉투는 손잡이로 꺼낸다</text>
<text x="400" y="82" text-anchor="middle" font-size="19" fill="#475569">손잡이를 당기면 입구가 막혀 먼지가 덜 샌다(드리미 L20 · 에코백스 T90)</text>
<path d="M400,100 v270" stroke="#BFDBFE" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="90" y="130" width="220" height="190" rx="14" fill="#E2E8F0" stroke="#1E293B" stroke-width="4"/><rect x="140" y="150" width="120" height="150" rx="10" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><rect x="140" y="250" width="120" height="50" rx="8" fill="#94A3B8"/><rect x="172" y="132" width="56" height="22" rx="6" fill="#2563EB"/><path d="M200,128 v-18" stroke="#22C55E" stroke-width="5"/><path d="M190,118 l10,-12 l10,12" fill="none" stroke="#22C55E" stroke-width="5"/><text x="200" y="352" text-anchor="middle" font-size="21" font-weight="800" fill="#1E293B">손잡이 잡고 위로 ○</text><rect x="490" y="130" width="220" height="190" rx="14" fill="#E2E8F0" stroke="#1E293B" stroke-width="4"/><path d="M490,130 l-30,-40 h220 l30,40" fill="#CBD5E1" stroke="#1E293B" stroke-width="4" stroke-linejoin="round"/><rect x="540" y="150" width="120" height="150" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><circle cx="676" cy="112" r="18" fill="#22C55E"/><path d="M667,112 l6,6 l12,-12" stroke="#FFFFFF" stroke-width="4" fill="none"/><text x="600" y="352" text-anchor="middle" font-size="21" font-weight="800" fill="#1E293B">새 봉투 끼우고 뚜껑 끝까지 ○</text></svg>
