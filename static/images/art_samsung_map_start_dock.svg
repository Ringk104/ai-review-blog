<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">맵을 그린 자리의 충전기에서 출발하기</text>
<text x="400" y="82" text-anchor="middle" font-size="20" fill="#475569">충전기를 옮기거나 다른 곳에서 출발하면 저장된 맵에서 위치를 못 찾을 수 있다</text>
<path d="M400,100 v270" stroke="#BFDBFE" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="40" y="110" width="320" height="200" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
<path d="M40,200 h120 M220,200 h140 M200,110 v50" stroke="#1E293B" stroke-width="4"/>
<rect x="56" y="250" width="40" height="52" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/><rect x="62" y="258" width="28" height="10" rx="2" fill="#22C55E"/>
<circle cx="126" cy="282" r="20" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/><circle cx="126" cy="282" r="6" fill="#1E293B"/>
<path d="M150,270 q60,-40 120,-20" fill="none" stroke="#2563EB" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/><path d="M278,252 l-14,-8 l2,16 z" fill="#2563EB"/>
<text x="200" y="350" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">그 자리 충전기에서 출발 ○</text>
<rect x="440" y="110" width="320" height="200" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
<path d="M440,200 h120 M620,200 h140 M600,110 v50" stroke="#1E293B" stroke-width="4"/>
<rect x="456" y="250" width="40" height="52" rx="6" fill="none" stroke="#94A3B8" stroke-width="4" stroke-dasharray="6 5"/>
<path d="M500,276 h120" stroke="#EF4444" stroke-width="3" stroke-dasharray="6 5"/><path d="M628,276 l-12,-7 v14 z" fill="#EF4444"/>
<rect x="640" y="250" width="40" height="52" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/><rect x="646" y="258" width="28" height="10" rx="2" fill="#22C55E"/>
<circle cx="690" cy="160" r="20" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/><circle cx="690" cy="160" r="6" fill="#1E293B"/>
<text x="690" y="134" text-anchor="middle" font-size="26" font-weight="800" fill="#EF4444">?</text>
<text x="560" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#EF4444">1m 이상 옮김</text>
<text x="600" y="350" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">충전기 옮김·다른 곳 출발 ✕</text></svg>
