<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">벽에 붙이고</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">앞 1.5m 비우기</text><text x="16" y="214" font-size="15" fill="#475569">양옆 0.5m · 평평한 곳</text></g>
