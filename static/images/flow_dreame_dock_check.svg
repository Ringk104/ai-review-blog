<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">도크 전원·</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">뒤쪽 스위치</text><text x="16" y="214" font-size="15" fill="#475569">표시등이 켜지는지</text></g>
