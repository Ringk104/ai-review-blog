<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">라이다·반사 필름·</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">바퀴·접점 닦기</text><text x="16" y="214" font-size="15" fill="#475569">전원 끄고 마른 천</text></g>
