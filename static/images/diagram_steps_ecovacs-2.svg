<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="544" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">브러시에 머리카락·반려동물 털 엉킨 후 오류 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="95" font-size="15" fill="#1E293B">로봇청소기를 뒤집어 브러시 커버를 열고 메인 브러시 분리</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="173" font-size="15" fill="#1E293B">축 양쪽에 감긴 머리카락을 가위로 조심스럽게 절단 후 제거</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="251" font-size="15" fill="#1E293B">브러시 표면의 털과 먼지를 솔로 닦아내고 물로 헹구어 건조</text><line x1="52" y1="348" x2="52" y2="378" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="329" font-size="15" fill="#1E293B">흡입구 내부와 브러시 커버 홈에 낀 이물질도 함께 제거</text><line x1="52" y1="426" x2="52" y2="456" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="402" r="20" fill="#2563EB"/><text x="52" y="408" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="88" y="378" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="407" font-size="15" fill="#1E293B">브러시를 재장착 후 앱에서 '오류 해제' 또는 재부팅</text><circle cx="52" cy="480" r="20" fill="#2563EB"/><text x="52" y="486" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="88" y="456" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="485" font-size="15" fill="#1E293B">이후 주 1회 브러시 점검 루틴 설정</text></svg>