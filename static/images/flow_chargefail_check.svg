<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="330" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">충전대에 있는데 충전이 안 될 때 — 이 순서로</text>
<g transform="translate(24,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">1</text>
<rect x="70" y="58" width="34" height="44" rx="6" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><path d="M80,68 v12 M94,68 v12" stroke="#1E293B" stroke-width="3"/><path d="M87,102 v16 q0,10 14,10 h40" stroke="#1E293B" stroke-width="3" fill="none"/><rect x="130" y="70" width="40" height="50" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="150" cy="84" r="5" fill="#2563EB"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">충전대 전원</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">램프 확인</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">플러그·어댑터·멀티탭</text></g>
<g transform="translate(216,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">2</text>
<circle cx="112" cy="80" r="34" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="112" cy="63" r="11" fill="#1E293B"/><rect x="96" y="120" width="32" height="14" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><rect x="112" y="122" width="14" height="10" rx="2" fill="#2563EB"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">본체 전원·</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">비상스위치 켜기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">꺼져 있으면 충전 안 됨</text></g>
<g transform="translate(408,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">3</text>
<rect x="50" y="70" width="120" height="44" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="70" y="84" width="24" height="12" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><rect x="126" y="84" width="24" height="12" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><path d="M98,40 l40,-10 l8,24 l-40,10 z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">단자 닦고</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">다시 끼우기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">전원 뽑고 마른 천</text></g>
<g transform="translate(600,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">4</text>
<rect x="62" y="62" width="88" height="44" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><rect x="150" y="76" width="8" height="16" fill="#1E293B"/><rect x="68" y="68" width="18" height="32" rx="2" fill="#EF4444"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">방전·온도·</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">배터리 보기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">5°C 이하면 충전 안 될 수</text></g>
</svg>