<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">돌아올 때까지</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">건드리지 않기</text><text x="16" y="214" font-size="15" fill="#475569">들거나 옮기지 않기</text></g>
