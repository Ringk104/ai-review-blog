<rect x="40" y="46" width="130" height="8" fill="#475569"/><rect x="84" y="54" width="40" height="54" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="104" cy="67" r="5" fill="#2563EB"/><rect x="56" y="54" width="100" height="70" rx="6" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5"/>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">충전대 자리</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">먼저 정하기</text><text x="16" y="214" font-size="15" fill="#475569">앞·좌우 비우기</text></g>
<g transform="translate(216,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">2</text>
<rect x="58" y="44" width="50" height="80" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M108,44 l40,14 v80 l-40,-14 z" fill="#DBEAFE" stroke="#1E293B" stroke-width="3"/><circle cx="140" cy="60" r="10" fill="#FACC15"/>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">바닥 치우고</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">방문 열고 불</text><text x="16" y="214" font-size="15" fill="#475569">떨어질 곳은 닫기</text></g>
<g transform="translate(408,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">3</text>
