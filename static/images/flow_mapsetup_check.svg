<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">충전 끝내고</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">충전대에서 출발</text><text x="16" y="214" font-size="15" fill="#475569">앱에서 지도 만들기</text></g>
