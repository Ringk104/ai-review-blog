<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="400" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">충전대 자리 — 좌우 0.5m, 앞 1m 안에 장애물 없이</text>
<rect x="110" y="76" width="380" height="14" fill="#475569"/><text x="470" y="70" text-anchor="end" font-size="16" font-weight="400" fill="#475569">벽에 붙인다</text><rect x="250" y="90" width="100" height="62" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="4"/><text x="300" y="128" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">충전대</text><rect x="140" y="90" width="320" height="250" rx="8" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 7"/><path d="M300,162 v170 m-10,-12 l10,12 l10,-12 m-20,-158 l10,-12 l10,12" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="312" y="256" text-anchor="start" font-size="18" font-weight="800" fill="#2563EB">앞 1m</text><text x="312" y="280" text-anchor="start" font-size="13" font-weight="400" fill="#475569">(LG R9·M9 도 1m 이상)</text><path d="M246,120 h-100 m12,-10 l-12,10 l12,10 M354,120 h100 m-12,-10 l12,10 l-12,10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="196" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#2563EB">0.5m</text><text x="404" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#2563EB">0.5m</text><g transform="translate(520,90)"><rect width="250" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><text x="125" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">피할 곳</text><path d="M20,62 l16,16 M36,62 l-16,16" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="48" y="76" text-anchor="start" font-size="16" font-weight="800" fill="#1E293B">좁은 통로·방문 주변</text><text x="48" y="95" text-anchor="start" font-size="13" font-weight="400" fill="#475569">방향을 못 잡음(삼성)</text><path d="M20,108 l16,16 M36,108 l-16,16" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="48" y="122" text-anchor="start" font-size="16" font-weight="800" fill="#1E293B">문턱·평평하지 않은 바닥</text><text x="48" y="141" text-anchor="start" font-size="13" font-weight="400" fill="#475569">올라가지 못함(LG)</text><path d="M20,154 l16,16 M36,154 l-16,16" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="48" y="168" text-anchor="start" font-size="16" font-weight="800" fill="#1E293B">거울·유리·하이글로시</text><text x="48" y="187" text-anchor="start" font-size="13" font-weight="400" fill="#475569">센서가 인식 못 함(LG)</text><path d="M20,200 l16,16 M36,200 l-16,16" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="48" y="214" text-anchor="start" font-size="16" font-weight="800" fill="#1E293B">직사광선이 드는 곳</text><text x="48" y="233" text-anchor="start" font-size="13" font-weight="400" fill="#475569">충전대를 옮긴다(LG)</text></g><text x="400" y="376" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">삼성전자서비스 «충전복귀가 되지 않아 자동 충전이 안 돼요» · LG전자 «충전대로 복귀하지 않아요» 기준</text></svg>