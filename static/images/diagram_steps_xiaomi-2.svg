<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="388" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">센서 오류(먼지통·바퀴·메인브러시 인식 에러) 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="85" font-size="15" fill="#1E293B">먼지통 분리 후 내부 센서 접점을 마른 천이나 알코올 솜으로 </text><text x="108" y="105" font-size="15" fill="#1E293B">닦기</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="173" font-size="15" fill="#1E293B">메인브러시·사이드브러시를 분해해 감긴 머리카락 완전 제거</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="251" font-size="15" fill="#1E293B">좌우 바퀴를 손으로 돌려보며 이물질 확인 및 제거</text><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="329" font-size="15" fill="#1E293B">청소기 전원 버튼 5초 길게 눌러 재부팅</text></svg>