<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">방전·온도·배터리 — 여기까지 봤는데도 안 되면</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="98" y="40" width="44" height="58" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="54" r="5" fill="#2563EB"/><circle cx="120" cy="126" r="24" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="114" r="8" fill="#1E293B"/><path d="M120,96 v-6 m-8,8 l8,-8 l8,8" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">완전히 방전됐다면</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">충전대 정면에 맞춰 손으로 올린다</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="106" y="34" width="24" height="96" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><circle cx="118" cy="132" r="18" fill="#2563EB" stroke="#1E293B" stroke-width="3"/><rect x="113" y="90" width="10" height="40" fill="#2563EB"/><text x="150" y="100" text-anchor="start" font-size="18" font-weight="800" fill="#2563EB">5°C</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">추운 곳이라면</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">5°C 이하면 충전이 안 될 수 있다(LG)</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="76" y="62" width="88" height="44" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><rect x="150" y="76" width="8" height="16" fill="#1E293B"/><rect x="68" y="68" width="18" height="32" rx="2" fill="#F59E0B"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">완충해도 금방 꺼지면</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">배터리는 소모품 — 교체를 문의</text></g></svg>