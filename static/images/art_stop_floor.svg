<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">청소 전에 바닥 정리 (삼성전자서비스)</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="90" cy="100" r="28" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="90" cy="86" r="9" fill="#1E293B"/><rect x="128" y="96" width="34" height="32" rx="4" fill="#F59E0B" stroke="#1E293B" stroke-width="2"/><path d="M180,70 v58 m-6,-52 l6,-6 l6,6 m-12,46 l6,6 l6,-6" stroke="#2563EB" stroke-width="2" fill="none"/><text x="196" y="104" text-anchor="start" font-size="13" font-weight="800" fill="#2563EB">40mm</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">40mm 이하 가벼운 물건</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">밀고 다닐 수 있다 — 미리 치우기</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="56" y="50" width="128" height="20" rx="4" fill="#1E293B"/><rect x="66" y="70" width="6" height="66" fill="#1E293B"/><rect x="168" y="70" width="6" height="66" fill="#1E293B"/><circle cx="120" cy="118" r="18" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="109" r="6" fill="#1E293B"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">검은 가구·얇은 다리</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">센서가 못 볼 수 있다 — 범퍼가 감지</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="40" y="50" width="14" height="96" fill="#475569"/><rect x="96" y="50" width="10" height="96" fill="#2563EB"/><path d="M60,40 h40 m-8,-6 l8,6 l-8,6 m-32,-12 l-8,6 l8,6" stroke="#2563EB" stroke-width="2" fill="none"/><text x="80" y="34" text-anchor="middle" font-size="13" font-weight="800" fill="#2563EB">15cm</text><text x="47" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">계단·단차</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">진입 방지 테이프</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">막을 곳 약 15cm 앞에</text></g></svg>