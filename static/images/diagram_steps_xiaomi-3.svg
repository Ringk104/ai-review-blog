<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="388" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">물걸레 냄새 및 곰팡이 발생 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="95" font-size="15" fill="#1E293B">청소 완료 직후 물걸레 패드를 분리해 흐르는 물에 헹구기</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="163" font-size="15" fill="#1E293B">물탱크에 물 + 로봇청소기 전용 세제(또는 구연산 1g) 혼합</text><text x="108" y="183" font-size="15" fill="#1E293B">해 사용</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="251" font-size="15" fill="#1E293B">걸레를 베란다나 햇볕 잘 드는 곳에 3시간 이상 건조</text><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="329" font-size="15" fill="#1E293B">스테이션 열풍 건조 기능이 있다면 설정을 '최대 건조'로 변경</text></svg>