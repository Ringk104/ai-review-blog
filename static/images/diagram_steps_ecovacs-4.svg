<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="466" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">문턱·턱을 못 넘거나 덜컹거림 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="95" font-size="15" fill="#1E293B">턱 높이를 자로 측정해 2cm 이하인지 확인</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="163" font-size="15" fill="#1E293B">2cm 이하인데 못 넘는다면 턱 앞에 미끄럼 방지 매트 깔아 </text><text x="108" y="183" font-size="15" fill="#1E293B">마찰력 확보</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="241" font-size="15" fill="#1E293B">2cm 초과 턱은 시중 로봇청소기 전용 경사로(고무·실리콘 재</text><text x="108" y="261" font-size="15" fill="#1E293B">질) 설치</text><line x1="52" y1="348" x2="52" y2="378" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="319" font-size="15" fill="#1E293B">경사로 설치 어려운 경우 앱에서 해당 문턱 주변을 '금지 구역</text><text x="108" y="339" font-size="15" fill="#1E293B">'으로 지정</text><circle cx="52" cy="402" r="20" fill="#2563EB"/><text x="52" y="408" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="88" y="378" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="397" font-size="15" fill="#1E293B">매트나 얇은 발판은 로봇청소기가 걸릴 수 있으니 청소 전 치우</text><text x="108" y="417" font-size="15" fill="#1E293B">거나 금지 구역 설정</text></svg>