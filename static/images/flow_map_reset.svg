<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="470" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">지도가 틀어졌다면 — 이 순서로 보세요</text>
<g transform="translate(30,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<rect x="268" y="56" width="44" height="56" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 5"/><rect x="268" y="56" width="44" height="56" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" transform="rotate(35 290 84)"/><path d="M262,38 a40,40 0 0 1 56,4" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M324,48 l-4,-14 l-10,10 z" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">충전대를</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">옮기거나 돌렸나?</text><text x="24" y="164" font-size="18" fill="#475569">그렇다면 다시 만드는 게 맞다</text></g>
<g transform="translate(420,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<rect x="236" y="40" width="48" height="90" fill="#DBEAFE" stroke="#1E293B" stroke-width="3"/><rect x="284" y="40" width="48" height="90" fill="#E0F2FE" stroke="#1E293B" stroke-width="3"/><path d="M284,40 v90" stroke="#2563EB" stroke-width="5" stroke-dasharray="8 6"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">방 경계만</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">틀렸나?</text><text x="24" y="164" font-size="18" fill="#475569">방 나누기·합치기로 고쳐 본다</text></g>
<g transform="translate(30,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<path d="M226,120 h30 M306,120 h28" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/><path d="M256,120 l40,-50" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/><path d="M306,120 A50,50 0 0 0 296,70" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 5"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">바닥 치우고</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">방문 열기</text><text x="24" y="164" font-size="18" fill="#475569">지우기 전에 준비</text></g>
<g transform="translate(420,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<rect x="244" y="44" width="80" height="80" rx="6" fill="#F1F5F9" stroke="#1E293B" stroke-width="3"/><path d="M284,64 a20,20 0 1 1 -20,20" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><path d="M256,84 l8,12 l8,-12 z" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">지도 삭제 →</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">새 지도 만들기</text><text x="24" y="164" font-size="18" fill="#475569">끝날 때까지 로봇을 건드리지 않기</text></g></svg>
