<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">바퀴·앞바퀴</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">이물질 빼기</text><text x="16" y="214" font-size="15" fill="#475569">천 깔고 뒤집어서</text></g>
