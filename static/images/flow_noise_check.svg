<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">먼지통 비우고</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">필터 먼지 털기</text><text x="16" y="214" font-size="15" fill="#475569">씻은 건 완전히 말리기</text></g>
