<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">닦을 곳 — 로봇은 이것들로 도크를 찾는다</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="100" r="56" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="84" r="20" fill="#1E293B"/><path d="M90,58 q30,-24 60,0" stroke="#2563EB" stroke-width="3" fill="none" stroke-dasharray="4 4"/><text x="120" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">① 라이다(위쪽 센서)</text><text x="120" y="228" text-anchor="middle" font-size="14" fill="#475569">가린 것 없이 깨끗하게</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="70" y="40" width="100" height="120" rx="12" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="88" y="108" width="64" height="20" rx="4" fill="#94A3B8" stroke="#1E293B" stroke-width="2"/><path d="M96,112 l10,12 M110,112 l10,12 M124,112 l10,12" stroke="#F8FAFC" stroke-width="2"/><text x="120" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">② 도크 반사 필름</text><text x="120" y="228" text-anchor="middle" font-size="14" fill="#475569">얼룩·가림 없이</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="40" y="120" width="160" height="16" rx="5" fill="#94A3B8" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="88" r="32" fill="#334155" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="88" r="12" fill="#CBD5E1"/><path d="M60,132 q6,-8 12,0 M150,132 q6,-8 12,0" stroke="#92400E" stroke-width="4" fill="none" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">③ 바퀴·도크 바닥판</text><text x="120" y="228" text-anchor="middle" font-size="14" fill="#475569">진흙·먼지 없이</text></g></svg>