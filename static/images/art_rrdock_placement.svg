<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="400" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">도크 자리 — 벽에 붙이고 앞과 양옆을 비우기</text>
<rect x="110" y="76" width="380" height="14" fill="#475569"/><text x="470" y="70" text-anchor="end" font-size="16" fill="#475569">벽</text><rect x="250" y="90" width="100" height="62" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="4"/><text x="300" y="128" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">도크</text><rect x="140" y="90" width="320" height="250" rx="8" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 7"/><path d="M300,162 v170 m-10,-12 l10,12 l10,-12 m-20,-158 l10,-12 l10,12" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="312" y="250" font-size="18" font-weight="800" fill="#2563EB">앞쪽 1.5m</text><text x="312" y="274" font-size="13" fill="#475569">Qrevo 2 Pro 설명서는</text><text x="312" y="292" font-size="13" fill="#475569">깊이 1.2m 이상</text><path d="M246,120 h-100 m12,-10 l-12,10 l12,10 M354,120 h100 m-12,-10 l12,10 l-12,10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="196" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#2563EB">0.5m</text><text x="404" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#2563EB">0.5m</text><g transform="translate(520,90)"><rect width="250" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><text x="125" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">피할 곳</text><path d="M20,62 l16,16 M36,62 l-16,16" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/><text x="48" y="76" font-size="17" font-weight="800" fill="#1E293B">카펫·매트 위</text><text x="48" y="95" font-size="13" fill="#475569">도크가 기울어짐</text><path d="M20,108 l16,16 M36,108 l-16,16" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/><text x="48" y="122" font-size="17" font-weight="800" fill="#1E293B">좁은 틈</text><text x="48" y="141" font-size="13" fill="#475569">로봇이 바닥에서 들뜸</text><path d="M20,154 l16,16 M36,154 l-16,16" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/><text x="48" y="168" font-size="17" font-weight="800" fill="#1E293B">직사광선</text><text x="48" y="187" font-size="13" fill="#475569">신호부를 방해</text><path d="M20,200 l16,16 M36,200 l-16,16" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/><text x="48" y="214" font-size="17" font-weight="800" fill="#1E293B">늘어진 전원선</text><text x="48" y="233" font-size="13" fill="#475569">걸려서 도크가 밀림</text></g><text x="400" y="376" text-anchor="middle" font-size="15" fill="#475569">로보락 고객지원 일반 안내 기준 · 내 모델 설명서의 «도크 배치» 그림을 우선</text></svg>