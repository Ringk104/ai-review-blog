<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">연결이 막히면 — 와이파이 재설정부터</text>
<text x="400" y="82" text-anchor="middle" font-size="19" fill="#475569">공유기·비밀번호를 바꿨을 때도 재설정 후 새 기기로 추가(로보락 Qrevo 2 Pro)</text>
<rect x="40" y="110" width="220" height="200" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="74" cy="144" r="20" fill="#2563EB"/><text x="74" y="152" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">1</text><text x="150" y="270" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">와이파이 재설정</text><text x="150" y="296" text-anchor="middle" font-size="15" fill="#475569">설명서의 버튼을 길게</text><circle cx="150" cy="200" r="34" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="150" cy="189" r="7" fill="#1E293B"/><path d="M196,170 a30,30 0 1 1 -8,-26" fill="none" stroke="#2563EB" stroke-width="4"/><path d="M190,140 l-2,12 l12,-2" fill="none" stroke="#2563EB" stroke-width="4"/><rect x="290" y="110" width="220" height="200" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="324" cy="144" r="20" fill="#2563EB"/><text x="324" y="152" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">2</text><text x="400" y="270" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">표시등 깜빡임</text><text x="400" y="296" text-anchor="middle" font-size="15" fill="#475569">천천히 깜빡이면 연결 대기</text><circle cx="400" cy="196" r="30" fill="#DBEAFE"/><circle cx="400" cy="196" r="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/><path d="M362,196 h-14 M452,196 h-14 M400,158 v-12" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><rect x="540" y="110" width="220" height="200" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="574" cy="144" r="20" fill="#2563EB"/><text x="574" y="152" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">3</text><text x="650" y="270" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">새 기기로 추가</text><text x="650" y="296" text-anchor="middle" font-size="15" fill="#475569">앱의 «기기 추가(+)»</text><rect x="622" y="150" width="56" height="94" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><circle cx="650" cy="196" r="16" fill="#22C55E"/><path d="M642,196 h16 M650,188 v16" stroke="#FFFFFF" stroke-width="3"/><path d="M266,210 h18 M516,210 h18" stroke="#2563EB" stroke-width="4"/><path d="M284,210 l-8,-6 v12 z M534,210 l-8,-6 v12 z" fill="#2563EB"/><text x="400" y="350" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">버튼 이름·누르는 시간은 모델마다 다르다 — 내 설명서의 «와이파이 연결»을 본다</text></svg>
