<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="470" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">물걸레가 안 돌 때 — 이 순서로 보세요</text>
<g transform="translate(30,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<circle cx="250" cy="96" r="30" fill="#E0F2FE" stroke="#1E293B" stroke-width="3"/><circle cx="312" cy="96" r="30" fill="#E0F2FE" stroke="#1E293B" stroke-width="3"/><path d="M232,96 a18,18 0 0 1 18,-18" fill="none" stroke="#2563EB" stroke-width="4"/><path d="M294,96 a18,18 0 0 1 18,-18" fill="none" stroke="#2563EB" stroke-width="4"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">원래 도는</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">걸레인가?</text><text x="24" y="164" font-size="18" fill="#475569">진동식은 돌지 않는다</text></g>
<g transform="translate(420,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<rect x="225" y="128" width="110" height="22" rx="4" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><rect x="240" y="78" width="80" height="34" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M280,70 v-28" stroke="#2563EB" stroke-width="4"/><path d="M280,32 l-8,12 h16 z" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">카펫·흡입만</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">청소 중인가?</text><text x="24" y="164" font-size="18" fill="#475569">걸레를 들면 정상</text></g>
<g transform="translate(30,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<ellipse cx="280" cy="118" rx="50" ry="14" fill="#E0F2FE" stroke="#1E293B" stroke-width="3"/><rect x="268" y="76" width="24" height="30" rx="4" fill="#94A3B8" stroke="#1E293B" stroke-width="3"/><text x="300" y="66" font-size="18" font-weight="800" fill="#B45309">딸깍</text>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">걸레·받침이</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">제자리에?</text><text x="24" y="164" font-size="18" fill="#475569">덜 끼우면 헛돈다</text></g>
<g transform="translate(420,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<rect x="232" y="56" width="44" height="66" rx="8" fill="#E0F2FE" stroke="#1E293B" stroke-width="3"/><rect x="236" y="80" width="36" height="38" rx="5" fill="#38BDF8"/><rect x="288" y="56" width="44" height="66" rx="8" fill="#F1F5F9" stroke="#1E293B" stroke-width="3"/><rect x="292" y="104" width="36" height="14" rx="4" fill="#94A3B8"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">물통에 물,</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">오수통은 비었나?</text><text x="24" y="164" font-size="18" fill="#475569">스테이션형</text></g></svg>
