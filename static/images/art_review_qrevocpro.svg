<circle cx="58" cy="313" r="5" fill="#15803D"/><text x="74" y="320" font-size="18" font-weight="700" fill="#1E293B">로봇 높이 96.5mm</text>
<rect x="410" y="100" width="360" height="280" rx="16" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
