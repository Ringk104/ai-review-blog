<circle cx="438" cy="221" r="5" fill="#B91C1C"/><text x="454" y="228" font-size="18" font-weight="700" fill="#1E293B">먼지 비움 7~9주·65일 표기</text>
<circle cx="438" cy="267" r="5" fill="#B91C1C"/><text x="454" y="274" font-size="18" font-weight="700" fill="#1E293B">물통형 — 물 채우기는 사람</text>
<circle cx="438" cy="313" r="5" fill="#B91C1C"/><text x="454" y="320" font-size="18" font-weight="700" fill="#1E293B">문턱 높이 공식 값 없음</text>
