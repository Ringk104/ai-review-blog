<text x="400" y="80" text-anchor="middle" font-size="18" fill="#475569">2026-11-27 쿠팡 본체 없음 · 로보락 코리아 페이지에서 판매</text>
<rect x="30" y="100" width="360" height="280" rx="16" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
<text x="50" y="138" font-size="21" font-weight="800" fill="#15803D">강점</text>
<circle cx="58" cy="175" r="5" fill="#15803D"/><text x="74" y="182" font-size="18" font-weight="700" fill="#1E293B">18,500Pa · 듀얼 엉킴 방지</text>
<circle cx="58" cy="221" r="5" fill="#15803D"/><text x="74" y="228" font-size="18" font-weight="700" fill="#1E293B">FlexiArm 가장자리 물걸레</text>
