<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">청정스테이션 표시등 (삼성 AI 스팀 로봇청소기)</text>
<g transform="translate(24,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="85" y="24" width="70" height="96" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="42" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="120" y="160" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">흰색</text><text x="120" y="190" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">먼지 배출 소리와 함께 켜짐</text><text x="120" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">먼지를 비우는 중 — 정상</text></g><g transform="translate(280,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="85" y="24" width="70" height="96" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="42" r="7" fill="#EF4444"/><path d="M110,34 l-8,-8 M146,34 l8,-8" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/><text x="120" y="160" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">빨간색 깜빡임</text><text x="120" y="190" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">먼지봉투 쪽 덮개 열림</text><text x="120" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">또는 고성능 필터 손질 시기</text></g><g transform="translate(536,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="85" y="24" width="70" height="96" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="42" r="7" fill="#EF4444"/><text x="120" y="160" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">빨간색 켜짐</text><text x="120" y="190" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">먼지봉투가 가득 참</text><text x="120" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">또는 봉투로 가는 통로가 막힘</text></g><text x="400" y="358" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">삼성전자서비스 «AI 스팀/스팀 청정스테이션 LED 상태 표시등 안내» 기준 — 모델마다 표시가 다를 수 있다</text></svg>