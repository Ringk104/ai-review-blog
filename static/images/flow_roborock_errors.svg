<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="470" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">빨간 불과 함께 멈췄다면 — 이 순서로</text>
<g transform="translate(30,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<rect x="236" y="34" width="96" height="58" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M256,92 l-6,18 l22,-18" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/><text x="284" y="76" text-anchor="middle" font-size="34" font-weight="800" fill="#2563EB">!</text>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">오류 번호·내용</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">확인하기</text><text x="24" y="164" font-size="18" fill="#475569">앱 알림·음성 안내</text></g>
<g transform="translate(420,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<rect x="236" y="30" width="96" height="84" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><rect x="238" y="70" width="92" height="20" fill="#DBEAFE"/><path d="M236,50 h96 M236,70 h96 M236,90 h96 M266,30 v84" stroke="#1E293B" stroke-width="2"/><path d="M226,80 h10" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">표에서 번호 찾고</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">전원 끄고 청소</text><text x="24" y="164" font-size="18" fill="#475569">그 부품을 정리</text></g>
<g transform="translate(30,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<circle cx="252" cy="96" r="24" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 5"/><path d="M270,76 q14,-18 30,-14" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M306,62 l-14,-6 l2,14 z" fill="#2563EB"/><circle cx="312" cy="96" r="24" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><circle cx="312" cy="92" r="7" fill="#CBD5E1" stroke="#1E293B" stroke-width="2"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">다른 자리로</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">옮겨 다시 시작</text><text x="24" y="164" font-size="18" fill="#475569">오류를 해결한 뒤</text></g>
<g transform="translate(420,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<path d="M310,78 A30,30 0 1 1 296,54" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/><path d="M290,40 l18,10 l-16,12 z" fill="#1E293B"/><circle cx="284" cy="80" r="8" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">그래도 같으면</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">시스템 재설정</text><text x="24" y="164" font-size="18" fill="#475569">→ 고객지원 문의</text></g></svg>
