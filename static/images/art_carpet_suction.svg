<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">카펫에서 흡입 세기 — 스마트 터보와 바닥 마스터(LG)</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="80" r="32" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="64" r="10" fill="#1E293B"/><path d="M176,104 v-44 m-10,12 l10,-12 l10,12" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="132" width="100" height="10" rx="3" fill="#93C5FD" stroke="#1E293B" stroke-width="2"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">스마트 터보</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">카펫을 감지하면 흡입을 높인다</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="100" cy="90" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="100" cy="75" r="10" fill="#1E293B"/><path d="M146,70 q10,20 0,40" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><path d="M160,70 q10,20 0,40" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><path d="M174,70 q10,20 0,40" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><path d="M100,144 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">소리가 커지면</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">바닥 마스터가 터보로 동작 — 정상</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="50" y="56" width="140" height="56" rx="12" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><text x="120" y="92" text-anchor="middle" font-size="22" font-weight="800" fill="#2563EB">터보</text><text x="120" y="146" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">짧고 부드러운 모는 감지 못 할 수</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">이미 터보라면</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">카펫에서 더 올라가지 않는다</text></g><text x="400" y="362" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">LG 코드제로 R9 사용가이드 · 로보킹 고객지원 · 로보킹 AI 올인원 제품 안내 기준</text></svg>