<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">도면이 사라졌다면 — 끄는 방법 확인(LG 코드제로 R5)</text>
<g transform="translate(24,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="92" y="50" width="56" height="90" rx="10" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><rect x="102" y="96" width="36" height="36" rx="6" fill="#EF4444"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">주 전원 스위치 On/Off</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">도면·금지 영역이 초기화</text></g><g transform="translate(280,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="96" r="40" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="76" r="13" fill="#1E293B"/><rect x="98" y="102" width="44" height="22" rx="6" fill="#2563EB"/><text x="170" y="60" text-anchor="start" font-size="18" font-weight="800" fill="#2563EB">5초</text><path d="M176,118 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">충전대 밖에서 전원 5초</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">저장한 설정은 남는다</text></g><g transform="translate(536,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="96" r="40" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="76" r="13" fill="#1E293B"/><rect x="98" y="102" width="44" height="22" rx="6" fill="#2563EB"/><text x="166" y="60" text-anchor="start" font-size="18" font-weight="800" fill="#EF4444">15초</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">[충전] 15초 이상</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">공장 초기화(앱 연결도)</text></g><text x="400" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">충전대로 돌아오지 않으면 도면은 미완성 상태로 저장된다</text><text x="400" y="368" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">LG전자 고객지원 «[LG 코드제로 R5] ThinQ 앱에서 자꾸 도면이 삭제돼요» 기준</text></svg>