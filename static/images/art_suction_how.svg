<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">로봇청소기는 «쓸어 담고 빨아들이는» 방식</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="60" y="86" width="120" height="28" rx="14" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M72,86 l8,28" stroke="#475569" stroke-width="3"/><path d="M88,86 l8,28" stroke="#475569" stroke-width="3"/><path d="M104,86 l8,28" stroke="#475569" stroke-width="3"/><path d="M120,86 l8,28" stroke="#475569" stroke-width="3"/><path d="M136,86 l8,28" stroke="#475569" stroke-width="3"/><path d="M152,86 l8,28" stroke="#475569" stroke-width="3"/><path d="M168,86 l8,28" stroke="#475569" stroke-width="3"/><path d="M70,60 q50,-30 100,0" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M162,52 l8,8 l-10,4" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">회전솔이 쓸어 담는다</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">그다음 흡입 — 진공청소기와 다름</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><ellipse cx="90" cy="96" rx="22" ry="10" fill="#93C5FD"/><path d="M130,80 q20,20 40,0" stroke="#1E293B" stroke-width="2" fill="none"/><ellipse cx="120" cy="112" rx="5" ry="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.5"/><ellipse cx="134" cy="112" rx="5" ry="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.5"/><ellipse cx="148" cy="112" rx="5" ry="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.5"/><ellipse cx="162" cy="112" rx="5" ry="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.5"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">잘 안 될 수 있는 것</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">젖어 붙은 이물·머리카락·쌀알(LG)</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="70" y="70" width="100" height="44" rx="22" fill="#2563EB"/><text x="120" y="99" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">터보</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">더 세게 하려면</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">터보 모드(삼성 안내)</text></g></svg>