<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="466" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">청소 중 갑자기 멈춤 (작동 중단) 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="95" font-size="15" fill="#1E293B">로봇청소기 전원 끄고 본체 뒤집기</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="173" font-size="15" fill="#1E293B">양쪽 바퀴 축과 메인 브러시에 감긴 머리카락·실 가위로 제거</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="251" font-size="15" fill="#1E293B">먼지통 분리 → 필터 꺼내 물 세척 → 24시간 그늘 건조</text><line x1="52" y1="348" x2="52" y2="378" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="329" font-size="15" fill="#1E293B">센서(하단 절벽 감지, 전면 범퍼) 부드러운 천으로 닦기</text><circle cx="52" cy="402" r="20" fill="#2563EB"/><text x="52" y="408" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="88" y="378" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="407" font-size="15" fill="#1E293B">충전 단자 접촉 불량 확인 후 재시작</text></svg>