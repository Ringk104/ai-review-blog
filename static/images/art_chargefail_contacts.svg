<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">충전 단자 닦기 — 전원 플러그부터 뽑는다</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="96" y="58" width="34" height="44" rx="6" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><path d="M106,68 v12 M120,68 v12" stroke="#1E293B" stroke-width="3"/><path d="M113,102 v14" stroke="#1E293B" stroke-width="3" fill="none"/><path d="M150,120 l16,16 M166,120 l-16,16" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">전원 플러그 뽑기</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">충전대를 닦기 전에(LG·삼성)</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="50" y="70" width="120" height="44" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="70" y="84" width="24" height="12" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><rect x="126" y="84" width="24" height="12" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><path d="M98,40 l40,-10 l8,24 l-40,10 z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">마른 천·부드러운 솔</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">힘을 너무 주면 단자가 휜다</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="80" y="50" width="56" height="90" rx="10" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><rect x="96" y="36" width="24" height="16" fill="#1E293B"/><path d="M150,80 l28,28 M178,80 l-28,28" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">쓰지 않는 것</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">시너·솔벤트·아세톤</text></g></svg>