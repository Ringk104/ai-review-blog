<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="388" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">오류 메시지 (오류 56, 43, 106 등) 반복 발생 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="85" font-size="15" fill="#1E293B">본체를 뒤집어 메인 브러시·사이드 브러시를 분리하고 감긴 머리</text><text x="108" y="105" font-size="15" fill="#1E293B">카락을 제거</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="163" font-size="15" fill="#1E293B">먼지통과 HEPA 필터를 꺼내 물로 세척 후 24시간 이상 건</text><text x="108" y="183" font-size="15" fill="#1E293B">조</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="241" font-size="15" fill="#1E293B">바퀴 주변 이물질 확인 및 청소, 재조립 후 재부팅(전원 버튼</text><text x="108" y="261" font-size="15" fill="#1E293B"> 5초 길게 누름)</text><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="329" font-size="15" fill="#1E293B">오류 지속 시 AS 센터 방문 또는 고객센터 문의</text></svg>