<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="544" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">앱 연결·매핑 오류 또는 알림 미작동 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="85" font-size="15" fill="#1E293B">공유기 설정에서 2.4GHz 대역 활성화 확인 (5GHz는 지</text><text x="108" y="105" font-size="15" fill="#1E293B">원 안 됨)</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="173" font-size="15" fill="#1E293B">에코백스 앱을 최신 버전으로 업데이트 (앱스토어·플레이스토어)</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="241" font-size="15" fill="#1E293B">앱 내 '설정 → 펌웨어 업데이트'에서 로봇청소기 펌웨어 최신</text><text x="108" y="261" font-size="15" fill="#1E293B">화</text><line x1="52" y1="348" x2="52" y2="378" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="329" font-size="15" fill="#1E293B">오류 지속 시 로봇청소기 전원 버튼 5초 길게 눌러 재부팅</text><line x1="52" y1="426" x2="52" y2="456" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="402" r="20" fill="#2563EB"/><text x="52" y="408" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="88" y="378" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="397" font-size="15" fill="#1E293B">앱에서 기기 삭제 후 '기기 추가'로 재등록 및 Wi-Fi 재</text><text x="108" y="417" font-size="15" fill="#1E293B">연결</text><circle cx="52" cy="480" r="20" fill="#2563EB"/><text x="52" y="486" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="88" y="456" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="475" font-size="15" fill="#1E293B">매핑 오류 시 '지도 초기화' 후 전체 청소 1회 실행해 재매</text><text x="108" y="495" font-size="15" fill="#1E293B">핑</text></svg>