<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">스마트싱스 등록이 안 되면 — 이것부터</text>
<g transform="translate(24,76)"><rect width="240" height="240" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="70" y="60" width="100" height="56" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M96,60 l-10,-26 M144,60 l10,-26" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/><text x="120" y="94" text-anchor="middle" font-size="18" font-weight="800" fill="#2563EB">2.4GHz</text><text x="120" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#94A3B8">5GHz</text><path d="M150,136 l14,14 M164,136 l-14,14" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">공유기는 2.4GHz</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">5GHz는 지원 안 함</text></g><g transform="translate(280,76)"><rect width="240" height="240" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="96" r="48" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="72" r="16" fill="#1E293B"/><circle cx="120" cy="96" r="12" fill="#2563EB"/><path d="M178,80 q10,16 0,32 M190,70 q18,26 0,52" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/><text x="120" y="170" text-anchor="middle" font-size="13" font-weight="800" fill="#2563EB">신호음까지 3초 이상</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">충전복귀 버튼 누르기</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">앱이 시킬 때 길게</text></g><g transform="translate(536,76)"><rect width="240" height="240" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="80" y="30" width="80" height="140" rx="14" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><rect x="90" y="56" width="60" height="18" rx="4" fill="#BFDBFE"/><text x="120" y="70" text-anchor="middle" font-size="12" font-weight="800" fill="#1E293B">vacuum</text><text x="120" y="104" text-anchor="middle" font-size="13" font-weight="800" fill="#2563EB">1111122222</text><rect x="100" y="120" width="40" height="16" rx="4" fill="#2563EB"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">vacuum 네트워크 선택</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">제품 암호(아이폰 검색 방식)</text></g><text x="400" y="346" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">삼성전자서비스 안내 기준 · 제품 암호는 집 공유기 비밀번호가 아님</text></svg>