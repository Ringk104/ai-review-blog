<text x="400" y="340" text-anchor="middle" font-size="20" fill="#475569">누르는 버튼은 모델마다 다르다 — 내 모델 설명서 확인</text>
<text x="400" y="372" text-anchor="middle" font-size="20" font-weight="800" fill="#B45309">S7: 1시간 넘게 두면 와이파이가 꺼진다 → 재설정 뒤 바로 등록</text></svg>
