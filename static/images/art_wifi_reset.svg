<text x="115" y="166" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">표시등이</text><text x="115" y="196" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">천천히 깜박임</text><text x="115" y="220" text-anchor="middle" font-size="16" fill="#475569">연결 기다리는 중</text></g>
