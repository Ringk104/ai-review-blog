<text x="115" y="166" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">두 버튼을</text><text x="115" y="196" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">함께 길게</text></g>
