<text x="115" y="166" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">앱에서 «+»</text><text x="115" y="196" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">새 기기로 추가</text></g>
