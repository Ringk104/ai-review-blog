<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">ThinQ 앱 등록이 안 될 때 — 세 가지부터</text>
<g transform="translate(24,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="98" y="40" width="44" height="76" rx="8" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><rect x="104" y="50" width="32" height="50" rx="3" fill="#DBEAFE"/><path d="M150,44 l20,20 M170,44 l-20,20" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">모바일 데이터 끄기</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">스마트폰을 공유기 Wi-Fi에</text></g><g transform="translate(280,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="85" y="92" width="70" height="30" rx="6" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M99,92 v-22 M141,92 v-22" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/><circle cx="105" cy="107" r="3" fill="#2563EB"/><circle cx="117" cy="107" r="3" fill="#2563EB"/><path d="M104,52 a22,22 0 0 1 32,0 M94,43 a36,36 0 0 1 52,0" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="60" r="4" fill="#2563EB"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">5G Wi-Fi 는 안 된다</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">2.4GHz 로 연결(로보킹)</text></g><g transform="translate(536,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="92" r="40" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="72" r="13" fill="#1E293B"/><rect x="98" y="102" width="44" height="22" rx="6" fill="#2563EB"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">버튼 3초 이상</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">모델마다 버튼이 다르다</text></g><text x="400" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">[터보]·[Wi-Fi] 버튼(R9) · [시작/정지]+[충전] 동시에(로보킹 AI 올인원)</text><text x="400" y="368" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">LG전자 고객지원 «앱 다운로드 및 설치 방법»(R9) · «ThinQ 제품 등록 방법»(로보킹 AI 올인원) 기준</text></svg>