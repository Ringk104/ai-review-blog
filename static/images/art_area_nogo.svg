<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">금지 구역은 넉넉하게, 서로 너무 가깝지 않게 (LG)</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="60" y="50" width="120" height="80" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M120,50 v34 M120,106 v24 M60,90 h40" stroke="#1E293B" stroke-width="3"/><rect x="64" y="54" width="54" height="40" fill="#FECACA" stroke="#EF4444" stroke-width="2"/><path d="M186,48 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">넉넉하게 그리기</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">앱의 1mm가 실제로 15cm 이상(R5)</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="60" y="50" width="120" height="80" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M120,50 v34 M120,106 v24 M60,90 h40" stroke="#1E293B" stroke-width="3"/><rect x="64" y="54" width="22" height="70" fill="#FECACA" stroke="#EF4444" stroke-width="2"/><rect x="92" y="54" width="22" height="70" fill="#FECACA" stroke="#EF4444" stroke-width="2"/><path d="M188,40 l16,16 M204,40 l-16,16" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">너무 가깝게 여러 개</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">사이가 덜 청소될 수 있다</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="60" y="50" width="14" height="96" fill="#475569"/><rect x="116" y="50" width="10" height="96" fill="#2563EB"/><text x="95" y="44" text-anchor="middle" font-size="13" font-weight="800" fill="#2563EB">15cm</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">진입 방지 테이프</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">막을 곳 약 15cm 앞에(삼성)</text></g></svg>