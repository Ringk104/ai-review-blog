<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">지도를 만들 때와 같은 환경이어야 한다 (삼성)</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="96" y="50" width="8" height="60" fill="#475569"/><path d="M104,50 l40,18" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/><path d="M160,48 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">문 열림 상태</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">만들 때와 같게 열거나 닫기</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="100" y="56" width="40" height="50" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="70" r="5" fill="#2563EB"/><path d="M150,80 h40 m-10,-10 l10,10 l-10,10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="70" text-anchor="middle" font-size="13" font-weight="800" fill="#2563EB">1m+</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">충전기 위치</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">45도·1m 넘게 옮기면 지도 다시</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="40" y="60" width="60" height="44" rx="4" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M108,82 h30 m-10,-10 l10,10 l-10,10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="146" y="60" width="60" height="44" rx="4" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">장애물 배치</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">가구를 크게 옮겼다면 확인</text></g></svg>