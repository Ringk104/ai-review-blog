<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="80" r="24" fill="#FDE68A" stroke="#1E293B" stroke-width="3"/><path d="M156,80 l10,0" stroke="#F59E0B" stroke-width="3"/><path d="M145,105 l6,7" stroke="#F59E0B" stroke-width="3"/><path d="M119,115 l0,9" stroke="#F59E0B" stroke-width="3"/><path d="M94,104 l-7,6" stroke="#F59E0B" stroke-width="3"/><path d="M85,78 l-9,0" stroke="#F59E0B" stroke-width="3"/><path d="M97,53 l-6,-7" stroke="#F59E0B" stroke-width="3"/><path d="M123,45 l0,-9" stroke="#F59E0B" stroke-width="3"/><path d="M147,58 l7,-6" stroke="#F59E0B" stroke-width="3"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">조명 켜기</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">20lux 미만이면 감지가 어렵다</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="56" y="96" width="128" height="28" fill="#E0F2FE" stroke="#1E293B" stroke-width="2"/><path d="M76,104 l20,12 M120,100 l20,16" stroke="#FFFFFF" stroke-width="4"/><circle cx="120" cy="74" r="20" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="64" r="6" fill="#1E293B"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">반사가 쉬운 바닥</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">하이그로시·유리·스테인리스는 오동작</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="80" cy="64" r="18" fill="#F59E0B"/><path d="M96,76 l40,30" stroke="#F59E0B" stroke-width="4"/><circle cx="150" cy="116" r="18" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="150" cy="107" r="6" fill="#1E293B"/><path d="M180,50 l16,16 M196,50 l-16,16" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">직사광선·실외에서 쓰지 않기</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">마룻바닥에 맞춰져 있다</text></g></svg>