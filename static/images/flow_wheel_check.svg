<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="330" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">바퀴에 머리카락이 감겼을 때 — 이 순서로</text>
<g transform="translate(24,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">1</text>
<circle cx="100" cy="90" r="34" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="60" y="82" width="12" height="16" rx="4" fill="#1E293B"/><rect x="128" y="82" width="12" height="16" rx="4" fill="#1E293B"/><circle cx="100" cy="66" r="5" fill="#475569"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">전원 끄고</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">천 위에 뒤집기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">먼지통부터 빼기(LG)</text></g>
<g transform="translate(216,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">2</text>
<circle cx="96" cy="96" r="26" fill="#1E293B"/><circle cx="96" cy="96" r="16" fill="#475569"/><path d="M74,90 q26,14 44,0" stroke="#F59E0B" stroke-width="3" fill="none"/><path d="M116,86 l40,-30 M122,92 l40,-24" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">구동 바퀴의</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">이물 빼기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">날카롭지 않은 막대·집게</text></g>
<g transform="translate(408,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">3</text>
<circle cx="100" cy="96" r="16" fill="#1E293B"/><circle cx="100" cy="96" r="6" fill="#CBD5E1"/><path d="M64,120 l60,-20" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">앞바퀴 빼서</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">청소하기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">일자 드라이버로(로보킹)</text></g>
<g transform="translate(600,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">4</text>
<rect x="84" y="58" width="32" height="56" rx="10" fill="#1E293B"/><path d="M140,52 v66 m-10,-56 l10,-10 l10,10 m-20,46 l10,10 l10,-10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="92" text-anchor="start" font-size="14" font-weight="800" fill="#2563EB">5회+</text>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">안 돌면</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">눌렀다 빼기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">위아래 5회 이상(R9)</text></g>
