<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="390" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">오류 번호 — 내 시리즈 표에서 찾는다</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="50" y="80" width="140" height="30" rx="15" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M70,82 l10,26" stroke="#1E293B" stroke-width="2"/><path d="M90,82 l10,26" stroke="#1E293B" stroke-width="2"/><path d="M110,82 l10,26" stroke="#1E293B" stroke-width="2"/><path d="M130,82 l10,26" stroke="#1E293B" stroke-width="2"/><path d="M150,82 l10,26" stroke="#1E293B" stroke-width="2"/><path d="M170,82 l10,26" stroke="#1E293B" stroke-width="2"/><text x="120" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#2563EB">오류 2</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">브러시가 안 돎</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">600·i 시리즈 공통</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="40" y="118" width="90" height="14" fill="#475569"/><circle cx="110" cy="98" r="22" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="110" cy="87" r="7" fill="#1E293B"/><path d="M130,132 v30" stroke="#475569" stroke-width="3" stroke-dasharray="4 4"/><text x="120" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#2563EB">오류 6</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">낭떠러지 센서</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">센서 닦고 다른 곳에서</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="78" y="80" width="84" height="56" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" stroke-dasharray="6 5"/><text x="120" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">먼지통</text><text x="120" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#2563EB">오류 14</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">먼지통 감지 안 됨</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">600 시리즈는 «1-4»</text></g><text x="400" y="370" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">iRobot 고객지원 600·i 시리즈 오류 표 기준 — 같은 번호라도 시리즈마다 설명이 다르다</text></svg>