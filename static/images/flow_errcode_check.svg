<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="330" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">로봇청소기가 코드를 띄웠다면 — 이 순서로</text>
<g transform="translate(24,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">1</text>
<rect x="70" y="52" width="80" height="68" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M84,72 h52 M84,88 h40 M84,104 h46" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
<text x="16" y="156" font-size="19" font-weight="800" fill="#1E293B">코드·알림 문장</text><text x="16" y="184" font-size="19" font-weight="800" fill="#1E293B">그대로 적어 두기</text><text x="16" y="214" font-size="16" fill="#475569">캡처해 두어도 된다</text></g>
<g transform="translate(216,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">2</text>
<rect x="64" y="20" width="62" height="28" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="95" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#1E293B">C01</text>
<rect x="90" y="58" width="72" height="28" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="126" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#1E293B">ER06</text>
<rect x="58" y="96" width="72" height="28" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="94" y="116" text-anchor="middle" font-size="16" font-weight="800" fill="#1E293B">1012</text>
<text x="16" y="156" font-size="19" font-weight="800" fill="#1E293B">내 브랜드의</text><text x="16" y="184" font-size="19" font-weight="800" fill="#1E293B">코드 체계 확인</text><text x="16" y="214" font-size="16" fill="#475569">브랜드마다 다르다</text></g>
<g transform="translate(408,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">3</text>
<rect x="70" y="58" width="80" height="56" rx="14" fill="#F1F5F9" stroke="#1E293B" stroke-width="3"/><rect x="80" y="72" width="28" height="28" rx="6" fill="#475569"/><text x="130" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#1E293B">OFF</text>
<text x="16" y="156" font-size="19" font-weight="800" fill="#1E293B">전원·비상 스위치</text><text x="16" y="184" font-size="19" font-weight="800" fill="#1E293B">끄고 손질</text><text x="16" y="214" font-size="16" fill="#475569">브러시·바퀴·센서</text></g>
<g transform="translate(600,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">4</text>
<rect x="88" y="50" width="44" height="74" rx="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><circle cx="110" cy="112" r="4" fill="#1E293B"/><path d="M98,66 h24 M98,78 h18" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
<text x="16" y="156" font-size="19" font-weight="800" fill="#1E293B">같은 코드가</text><text x="16" y="184" font-size="19" font-weight="800" fill="#1E293B">반복되면 고객센터</text><text x="16" y="214" font-size="16" fill="#475569">모델명·코드 알리기</text></g></svg>
