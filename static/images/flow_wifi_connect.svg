<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="470" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">와이파이 연결이 안 될 때 — 이 순서로 보세요</text>
<g transform="translate(30,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<rect x="232" y="44" width="100" height="40" rx="20" fill="#2563EB"/><text x="282" y="71" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">2.4GHz</text>
<rect x="232" y="96" width="100" height="40" rx="20" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="282" y="123" text-anchor="middle" font-size="20" font-weight="800" fill="#94A3B8">5GHz</text><path d="M240,104 l84,24" stroke="#94A3B8" stroke-width="3"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">2.4GHz</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">와이파이인가?</text><text x="24" y="164" font-size="18" fill="#475569">5GHz는 안 되는 경우가 많다</text></g>
<g transform="translate(420,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<circle cx="290" cy="118" r="7" fill="#2563EB"/><path d="M272,100 A26,26 0 0 1 308,100" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><path d="M258,84 A46,46 0 0 1 322,84" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><path d="M244,68 A66,66 0 0 1 336,68" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">신호 좋은 곳으로</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">옮겼나?</text><text x="24" y="164" font-size="18" fill="#475569">휴대폰도 로봇 가까이</text></g>
<g transform="translate(30,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<path d="M318,96 A32,32 0 1 1 300,67" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><path d="M296,54 l18,12 l-18,12 z" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">와이파이 재설정</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">→ 새 기기로 추가</text><text x="24" y="164" font-size="18" fill="#475569">누르는 버튼은 모델마다 다르다</text></g>
<g transform="translate(420,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<rect x="262" y="40" width="56" height="96" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><rect x="270" y="52" width="40" height="66" rx="4" fill="#E0F2FE"/><path d="M290,108 v-38" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><path d="M290,62 l-10,14 h20 z" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">앱이 최신</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">버전인가?</text><text x="24" y="164" font-size="18" fill="#475569">올린 뒤 다시 해 본다</text></g></svg>
