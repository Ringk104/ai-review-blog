<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">앞바퀴(전방 캐스터) 빼서 청소 (LG 로보킹)</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="96" r="16" fill="#1E293B"/><circle cx="120" cy="96" r="6" fill="#CBD5E1"/><path d="M84,120 l60,-20" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">일자 드라이버를</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">앞바퀴 밑에 넣어 들어 올리기</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="96" r="20" fill="#1E293B"/><circle cx="120" cy="96" r="7" fill="#CBD5E1"/><path d="M104,94 q16,-12 32,0 q-16,12 -32,0" stroke="#F59E0B" stroke-width="3" fill="none"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">바퀴 안쪽 이물 빼기</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">머리카락이 축에 감겨 있다</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="110" r="16" fill="#1E293B"/><circle cx="120" cy="110" r="6" fill="#CBD5E1"/><path d="M120,50 v34 m-10,-10 l10,10 l10,-10" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">위쪽을 강하게 눌러</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">다시 끼우기</text></g></svg>