<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="340" rx="20" fill="#EFF6FF"/>
<text x="400" y="50" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">재설정(Reset 3초)은 마지막에</text>
<text x="400" y="82" text-anchor="middle" font-size="20" fill="#475569">공장 초기화라 와이파이·지도 같은 설정이 지워질 수 있다</text>
<rect x="40" y="116" width="200" height="160" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="74" cy="148" r="20" fill="#2563EB"/><text x="74" y="156" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<text x="140" y="214" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">표의 조치</text><text x="140" y="246" text-anchor="middle" font-size="18" fill="#475569">청소·정리</text>
<path d="M248,196 h36" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><path d="M298,196 l-16,-10 v20 z" fill="#2563EB"/>
<rect x="300" y="116" width="200" height="160" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="334" cy="148" r="20" fill="#2563EB"/><text x="334" y="156" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<text x="400" y="214" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">껐다 켜기</text><text x="400" y="246" text-anchor="middle" font-size="18" fill="#475569">오작동 첫 조치</text>
<path d="M508,196 h36" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><path d="M558,196 l-16,-10 v20 z" fill="#2563EB"/>
<rect x="560" y="116" width="200" height="160" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 6"/><circle cx="594" cy="148" r="20" fill="#94A3B8"/><text x="594" y="156" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<circle cx="700" cy="150" r="18" fill="#F1F5F9" stroke="#1E293B" stroke-width="3"/><path d="M700,150 v-10 M700,150 l8,5" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/><text x="676" y="156" text-anchor="end" font-size="18" font-weight="800" fill="#B45309">3초</text>
<text x="660" y="214" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">Reset</text><text x="660" y="246" text-anchor="middle" font-size="18" fill="#475569">공장 초기화</text>
<text x="400" y="314" text-anchor="middle" font-size="18" fill="#475569">버튼 위치와 동작은 모델마다 다르니 내 모델 설명서 확인</text></svg>
