<text x="20" y="128" font-size="22" font-weight="800" fill="#1E293B">약 1.5m 앞에서</text><text x="20" y="158" font-size="22" font-weight="800" fill="#1E293B">직접 시험</text><text x="20" y="186" font-size="17" fill="#475569">충전복귀 버튼 누르기</text></g>
<g transform="translate(540,290)"><rect width="236" height="200" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="32" cy="32" r="20" fill="#2563EB"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">6</text>
<rect x="132" y="36" width="72" height="38" rx="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><rect x="204" y="47" width="8" height="16" rx="2" fill="#1E293B"/><rect x="138" y="42" width="16" height="26" rx="3" fill="#EF4444"/>
<text x="20" y="128" font-size="22" font-weight="800" fill="#1E293B">올라갔는데</text><text x="20" y="158" font-size="22" font-weight="800" fill="#1E293B">충전이 안 되면</text><text x="20" y="186" font-size="17" fill="#475569">스위치·배터리 확인</text></g></svg>
