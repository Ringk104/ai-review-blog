<text x="20" y="128" font-size="22" font-weight="800" fill="#1E293B">충전기 전원과</text><text x="20" y="158" font-size="22" font-weight="800" fill="#1E293B">충전 단자</text><text x="20" y="186" font-size="17" fill="#475569">빨간 불이 켜지나</text></g>
<g transform="translate(282,70)"><rect width="236" height="200" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="32" cy="32" r="20" fill="#2563EB"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<rect x="116" y="14" width="104" height="82" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5"/><rect x="186" y="22" width="28" height="56" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
<text x="20" y="128" font-size="22" font-weight="800" fill="#1E293B">충전기 자리</text><text x="20" y="158" font-size="22" font-weight="800" fill="#1E293B">좌우 0.5m·앞 1m</text><text x="20" y="186" font-size="17" fill="#475569">장애물 치우기</text></g>
<g transform="translate(540,70)"><rect width="236" height="200" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="32" cy="32" r="20" fill="#2563EB"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
