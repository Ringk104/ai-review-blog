<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="510" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">충전기로 못 돌아갈 때 — 이 순서로 보세요</text>
