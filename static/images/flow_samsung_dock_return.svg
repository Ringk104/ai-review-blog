<text x="20" y="128" font-size="22" font-weight="800" fill="#1E293B">충전기 앞에</text><text x="20" y="158" font-size="22" font-weight="800" fill="#1E293B">서 있지 않기</text><text x="20" y="186" font-size="17" fill="#475569">2m 밖으로 물러나기</text></g>
<g transform="translate(24,290)"><rect width="236" height="200" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="32" cy="32" r="20" fill="#2563EB"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<circle cx="176" cy="54" r="38" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><circle cx="176" cy="44" r="10" fill="#EF4444"/><path d="M160,28 l-6,-6 M192,28 l6,-6 M176,24 v-8" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
<text x="20" y="128" font-size="22" font-weight="800" fill="#1E293B">상태 표시등</text><text x="20" y="158" font-size="22" font-weight="800" fill="#1E293B">색 보기</text><text x="20" y="186" font-size="17" fill="#475569">빨간색 켜짐 → 손으로</text></g>
<g transform="translate(282,290)"><rect width="236" height="200" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="32" cy="32" r="20" fill="#2563EB"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">5</text>
