<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">소리 나는 곳 찾기 — 하나 빼고, 잠깐 돌려 보기</text>
<rect x="40" y="86" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><text x="140" y="130" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">① 부품 하나 빼기</text><text x="140" y="160" text-anchor="middle" font-size="14" fill="#475569">전원을 끄고</text><path d="M248,141 h50 m-12,-10 l12,10 l-12,10" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="306" y="86" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><text x="406" y="130" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">② 잠깐 돌려 보기</text><text x="406" y="160" text-anchor="middle" font-size="14" fill="#475569">소리가 나는지 듣기</text><path d="M514,120 q40,-20 58,-20 M514,162 q40,20 58,62" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="578" y="66" width="196" height="96" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/><text x="676" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">소리 그대로</text><text x="676" y="128" text-anchor="middle" font-size="14" fill="#475569">범인 아님 → 다시 끼우고</text><text x="676" y="148" text-anchor="middle" font-size="14" fill="#475569">다음 부품으로</text><rect x="578" y="184" width="196" height="96" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="676" y="218" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">소리 멈춤</text><text x="676" y="246" text-anchor="middle" font-size="14" fill="#475569">그 부품이 원인 → 청소해</text><text x="676" y="266" text-anchor="middle" font-size="14" fill="#475569">끼우고 한 번 더 돌려 보기</text><text x="400" y="330" text-anchor="middle" font-size="16" fill="#475569">빼 보는 순서: 메인 브러시와 덮개 → 사이드브러시 → 앞바퀴(로봇 앞쪽을 받쳐 두고)</text><text x="400" y="356" text-anchor="middle" font-size="14" fill="#475569">로보락 고객지원 «로봇청소기에서 소리가 날 때» 기준</text></svg>