<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">공유기를 바꿨다면 — 와이파이 초기화</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="60" y="40" width="120" height="96" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M76,60 h40 v30 h48 v30 h-88 z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M170,124 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">지도부터 저장</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">초기화하면 지도가 지워질 수 있다</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="92" r="44" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="70" r="0"/><rect x="96" y="70" width="18" height="12" rx="4" fill="#2563EB"/><rect x="126" y="70" width="18" height="12" rx="4" fill="#2563EB"/><text x="120" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#2563EB">3초</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">청소 + 도크 버튼</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">약 3초 — 음성 안내가 나올 때까지</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="96" y="40" width="46" height="80" rx="9" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><rect x="102" y="50" width="34" height="56" rx="3" fill="#DBEAFE"/><path d="M119,62 v28 M105,76 h28" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">앱에서 다시 추가</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">새 공유기는 같은 이름·비번이면 수월</text></g></svg>