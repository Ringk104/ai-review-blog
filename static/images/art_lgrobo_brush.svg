<g transform="translate(24,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="92" r="12" fill="#1E293B"/><path d="M120,92 l-44,-30" stroke="#475569" stroke-width="3" stroke-linecap="round"/><path d="M120,92 l46,-22" stroke="#475569" stroke-width="3" stroke-linecap="round"/><path d="M120,92 l-30,40" stroke="#475569" stroke-width="3" stroke-linecap="round"/><path d="M120,92 l40,34" stroke="#475569" stroke-width="3" stroke-linecap="round"/><path d="M150,44 l-22,40" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><path d="M146,36 l12,6" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">측면 회전솔(로보킹)</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">십자드라이버로 나사 풀기</text></g><g transform="translate(280,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="44" y="76" width="152" height="34" rx="17" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M66,78 l-8,30 M90,78 l-8,30 M114,78 l-8,30 M138,78 l-8,30 M162,78 l-8,30" stroke="#94A3B8" stroke-width="3"/><rect x="180" y="80" width="14" height="26" rx="4" fill="#F59E0B"/><path d="M120,54 v-16 m-10,10 l10,-10 l10,10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">주 회전솔(로보킹)</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">노란색 쪽으로 밀며 올림</text></g><g transform="translate(536,76)"><rect width="240" height="250" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="44" y="76" width="152" height="34" rx="17" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M66,78 l-8,30 M90,78 l-8,30 M114,78 l-8,30 M138,78 l-8,30 M162,78 l-8,30" stroke="#94A3B8" stroke-width="3"/><rect x="180" y="80" width="14" height="26" rx="4" fill="#2563EB"/><rect x="58" y="46" width="30" height="22" rx="6" fill="#2563EB"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">회전솔(R9)</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">분리 버튼·레버로 빼기</text></g><text x="400" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">측면 회전솔은 L·R 을 구분해 조립 · R9 는 «딸깍» 소리가 날 때까지 눌러 닫기</text><text x="400" y="368" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">LG전자 고객지원 «[LG 코드제로 로보킹] 회전솔» · «[LG 로봇청소기 R9] 회전솔» 안내 기준</text></svg>