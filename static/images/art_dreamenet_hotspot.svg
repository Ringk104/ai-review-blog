<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">다른 휴대폰 핫스팟으로 원인 가르기</text>
<rect x="70" y="110" width="60" height="104" rx="9" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><rect x="76" y="120" width="48" height="80" rx="3" fill="#DBEAFE"/><path d="M92,96 q8,-8 16,0" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M84,92 q16,-16 32,0" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M76,88 q24,-24 48,0" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/><text x="100" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#1E293B">휴대폰 A</text><text x="100" y="266" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">핫스팟 켜기</text><path d="M150,160 h70 m-12,-10 l12,10 l-12,10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="110" width="60" height="104" rx="9" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><rect x="246" y="120" width="48" height="80" rx="3" fill="#DBEAFE"/><text x="270" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#1E293B">휴대폰 B</text><text x="270" y="266" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">A 핫스팟에 붙고 앱으로 연결</text><path d="M320,160 h50 m-12,-10 l12,10 l-12,10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="162" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="410" cy="147" r="10" fill="#1E293B"/><text x="410" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#1E293B">로봇</text><g transform="translate(480,96)"><rect width="290" height="200" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><path d="M20,38 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="50" text-anchor="start" font-size="17" font-weight="800" fill="#1E293B">연결된다</text><text x="56" y="74" text-anchor="start" font-size="14" font-weight="400" fill="#475569">→ 집 공유기 설정 쪽 문제</text><path d="M22,116 l16,16 M38,116 l-16,16" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="56" y="130" text-anchor="start" font-size="17" font-weight="800" fill="#1E293B">연결 안 된다</text><text x="56" y="154" text-anchor="start" font-size="14" font-weight="400" fill="#475569">→ 로봇 하드웨어일 수 있음</text><text x="56" y="176" text-anchor="start" font-size="14" font-weight="400" fill="#475569">   고객지원에 이 결과를 알린다</text></g><text x="400" y="350" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">드리미 고객지원 «Failed to Connect Network/Wifi» FAQ 기준</text></svg>