<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">바퀴에 감긴 것 빼기 (LG 안내)</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="70" y="60" width="100" height="60" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M120,120 v30 m-10,-10 l10,10 l10,-10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">먼지통부터 빼기</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">그대로 뒤집으면 먼지가 쏟아진다</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="30" y="128" width="180" height="12" rx="4" fill="#DBEAFE"/><circle cx="120" cy="84" r="40" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="74" y="76" width="12" height="16" rx="4" fill="#1E293B"/><rect x="154" y="76" width="12" height="16" rx="4" fill="#1E293B"/><circle cx="120" cy="54" r="5" fill="#475569"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">천 위에 뒤집기</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">바퀴를 돌려 가며 이물 빼기</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="100" y="60" width="40" height="64" rx="10" fill="#1E293B"/><path d="M160,56 v70 m-10,-60 l10,-10 l10,10 m-20,50 l10,10 l10,-10" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="98" text-anchor="start" font-size="15" font-weight="800" fill="#2563EB">5회+</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">바퀴가 안 움직이면</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">위아래로 5회 이상 눌렀다 뺀다(R9)</text></g></svg>