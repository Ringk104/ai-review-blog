<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">구동 바퀴 — 막대나 집게로, 돌려 가며 (삼성 · LG)</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="30" y="128" width="180" height="12" rx="4" fill="#DBEAFE"/><circle cx="120" cy="84" r="40" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="74" y="76" width="12" height="16" rx="4" fill="#1E293B"/><rect x="154" y="76" width="12" height="16" rx="4" fill="#1E293B"/><circle cx="120" cy="54" r="5" fill="#475569"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">비상 스위치 끄고</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">부드러운 천 위에 뒤집기</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="110" cy="96" r="30" fill="#1E293B"/><circle cx="110" cy="96" r="20" fill="#475569"/><path d="M84,90 q30,14 52,0" stroke="#F59E0B" stroke-width="3" fill="none"/><path d="M134,86 l40,-30 M140,92 l40,-24" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">날카롭지 않은 막대·집게</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">끝이 뾰족한 도구는 쓰지 않기</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="120" cy="100" r="30" fill="#1E293B"/><circle cx="120" cy="100" r="20" fill="#475569"/><path d="M94,94 q30,14 52,0" stroke="#F59E0B" stroke-width="3" fill="none"/><path d="M80,60 a44,44 0 0,1 80,0" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M154,50 l6,10 l-12,2" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">바퀴를 돌려 가며</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">감긴 것을 끝까지 빼기(LG R9)</text></g></svg>