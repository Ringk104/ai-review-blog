<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="380" rx="20" fill="#EFF6FF"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">교체 주기와 «최대 ○일»은 다른 숫자</text>
<text x="400" y="82" text-anchor="middle" font-size="19" fill="#475569">파랑 = 제조사 교체 주기 · 주황 = 비우지 않고 버틸 수 있는 최대치(회사 조건)</text>
<text x="60" y="132" font-size="18" font-weight="800" fill="#1E293B">로보락 S8 (교체)</text><rect x="290" y="108" width="308" height="34" rx="8" fill="#2563EB"/><text x="300" y="132" font-size="17" font-weight="800" fill="#FFFFFF">7주마다</text><text x="60" y="174" font-size="18" font-weight="800" fill="#1E293B">드리미·LG (교체)</text><rect x="290" y="150" width="382.79999999999995" height="34" rx="8" fill="#2563EB"/><text x="300" y="174" font-size="17" font-weight="800" fill="#FFFFFF">1~2개월(최대 약 8.7주)</text><text x="60" y="228" font-size="18" font-weight="800" fill="#1E293B">로보락 S7 도크 (최대)</text><rect x="290" y="204" width="264" height="34" rx="8" fill="#F59E0B"/><text x="300" y="228" font-size="17" font-weight="800" fill="#FFFFFF">최대 6주</text><text x="60" y="270" font-size="18" font-weight="800" fill="#1E293B">Qrevo L Pro (최대)</text><rect x="290" y="246" width="408.5714285714286" height="34" rx="8" fill="#F59E0B"/><text x="300" y="270" font-size="17" font-weight="800" fill="#FFFFFF">최대 65일</text><text x="60" y="312" font-size="18" font-weight="800" fill="#1E293B">L20 Ultra (최대)</text><rect x="290" y="288" width="471.4285714285714" height="34" rx="8" fill="#F59E0B"/><text x="300" y="312" font-size="17" font-weight="800" fill="#FFFFFF">최대 75일 · 3.2L</text><path d="M290,140 v1" stroke="none"/><path d="M60,192 h680" stroke="#BFDBFE" stroke-width="2" stroke-dasharray="6 5"/><text x="400" y="358" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">앱 알림·표시등을 먼저 보고, 알림이 없어도 교체 주기는 넘기지 않는다</text></svg>
