<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="400" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">지도가 비스듬하면 — 새 지도를 만든다</text>
<g transform="translate(200,200) rotate(-20)"><path d="M-120,-80 h240 v100 h-90 v60 h-150 z" fill="#DBEAFE" stroke="#1E293B" stroke-width="5" stroke-linejoin="round"/><path d="M-20,-80 v60 M-20,20 v60" stroke="#1E293B" stroke-width="4"/></g>
<text x="200" y="346" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">비스듬한 지도</text>
<path d="M352,200 h76" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><path d="M444,200 l-18,-12 v24 z" fill="#2563EB"/>
<g transform="translate(600,200)"><path d="M-120,-80 h240 v100 h-90 v60 h-150 z" fill="#DBEAFE" stroke="#1E293B" stroke-width="5" stroke-linejoin="round"/><path d="M-20,-80 v60 M-20,20 v60" stroke="#1E293B" stroke-width="4"/></g>
<text x="600" y="346" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">가로·세로로 맞은 지도</text>
<text x="400" y="382" text-anchor="middle" font-size="18" fill="#475569">로보락: 도크를 옮기거나, 지도 저장을 껐다 켜면 새 지도</text></svg>
