<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="400" rx="20" fill="#EFF6FF"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">«리셋»과 «공장 초기화»는 다르다</text>
<text x="400" y="80" text-anchor="middle" font-size="18" fill="#475569">삼성전자서비스 안내 기준</text>
<g transform="translate(40,100)"><rect width="340" height="210" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<path d="M98,92 A34,34 0 1 1 80,62" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><path d="M76,48 l18,13 l-18,13 z" fill="#2563EB"/>
<text x="220" y="70" text-anchor="middle" font-size="26" font-weight="800" fill="#2563EB">리셋</text>
<text x="220" y="106" text-anchor="middle" font-size="20" fill="#1E293B">제품을 다시 시작</text>
<text x="170" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">등록은 그대로</text>
<text x="170" y="190" text-anchor="middle" font-size="18" fill="#475569">먼저 해 볼 것</text></g>
<g transform="translate(420,100)"><rect width="340" height="210" rx="16" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/>
<rect x="40" y="40" width="70" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"/><path d="M58,58 l34,22 M92,58 l-34,22" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
<text x="220" y="70" text-anchor="middle" font-size="26" font-weight="800" fill="#B45309">공장 초기화</text>
<text x="220" y="106" text-anchor="middle" font-size="20" fill="#1E293B">앱에서 오프라인으로</text>
<text x="170" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">지우고 다시 등록</text>
<text x="170" y="190" text-anchor="middle" font-size="18" fill="#475569">마지막에 할 것</text></g>
<text x="400" y="358" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B">리셋 → 와이파이 재설정 → 공장 초기화는 마지막</text></svg>
