<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="340" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">그래도 소리 나면 — 큰 바퀴는 굴려 보기만</text>
<circle cx="200" cy="180" r="80" fill="#334155" stroke="#1E293B" stroke-width="4"/><circle cx="200" cy="180" r="32" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M100,110 a120,120 0 0 1 80,-40 m-14,-8 l14,8 l-8,14" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="300" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">마른 천으로 닦고 손으로 굴려 보기</text><g transform="translate(420,90)"><rect width="340" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><text x="24" y="44" font-size="19" font-weight="800" fill="#1E293B">끼익거리거나 걸리거나</text><text x="24" y="72" font-size="19" font-weight="800" fill="#1E293B">한쪽만 뻑뻑하면</text><text x="24" y="110" font-size="17" font-weight="800" fill="#2563EB">→ 판매처·로보락 고객지원</text><path d="M24,140 l14,14 M38,140 l-14,14" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/><text x="48" y="153" font-size="15" fill="#475569">집에서 분해하지 않기</text></g></svg>