<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">올라가는데 충전이 안 되거나, 붙었다 떨어졌다 하면</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="40" y="70" width="160" height="60" rx="10" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="66" y="90" width="28" height="14" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><rect x="146" y="90" width="28" height="14" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><path d="M80,84 v-12 M160,84 v-12" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><path d="M98,40 l40,-10 l8,24 l-40,10 z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">① 전원 끄고 접점 닦기</text><text x="120" y="228" text-anchor="middle" font-size="14" fill="#475569">도크 접점이 다시 튀어나오는지</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="44" y="50" width="56" height="78" rx="8" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><circle cx="64" cy="82" r="4" fill="#1E293B"/><circle cx="80" cy="82" r="4" fill="#1E293B"/><circle cx="160" cy="88" r="38" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/><path d="M160,88 v-24 M160,88 l16,10" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#2563EB">약 2분</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">② 도크 전원 약 2분 끄기</text><text x="120" y="228" text-anchor="middle" font-size="14" fill="#475569">로봇도 다시 켜고 복귀</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="70" y="40" width="100" height="70" rx="12" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="120" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="170" y="70" width="36" height="20" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><rect x="173" y="73" width="22" height="14" rx="2" fill="#2563EB"/><rect x="206" y="76" width="4" height="8" fill="#1E293B"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">③ 바르게 올려 2~3시간</text><text x="120" y="228" text-anchor="middle" font-size="14" fill="#475569">앱에서 배터리가 오르는지</text></g></svg>