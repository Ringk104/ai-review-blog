<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">복귀 시험 — 충전대 앞 약 1.5m 에 두고 복귀 버튼</text>
<rect x="60" y="80" width="14" height="230" fill="#475569"/><rect x="74" y="166" width="60" height="58" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="104" cy="180" r="5" fill="#2563EB"/><circle cx="330" cy="195" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="330" cy="180" r="10" fill="#1E293B"/><path d="M296,195 h-150 m12,-10 l-12,10 l12,10" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="182" text-anchor="middle" font-size="18" font-weight="800" fill="#2563EB">약 1.5m</text><rect x="318" y="146" width="24" height="12" rx="4" fill="#2563EB"/><text x="330" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">복귀 버튼</text><g transform="translate(430,96)"><rect width="340" height="220" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><path d="M22,28 l16,16 M38,28 l-16,16" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/><text x="54" y="42" text-anchor="start" font-size="16" font-weight="800" fill="#1E293B">충전대 바로 앞에 두지 않는다</text><text x="54" y="64" text-anchor="start" font-size="13" font-weight="400" fill="#475569">경로를 확인하기 어렵다</text><path d="M20,94 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="106" text-anchor="start" font-size="16" font-weight="800" fill="#1E293B">누른 뒤 2m 밖으로 물러난다</text><text x="54" y="128" text-anchor="start" font-size="13" font-weight="400" fill="#475569">사람·물건에 적외선이 반사돼 오작동</text><path d="M20,158 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="170" text-anchor="start" font-size="16" font-weight="800" fill="#1E293B">충전대를 45도·1m 이상 옮겼다면</text><text x="54" y="192" text-anchor="start" font-size="13" font-weight="400" fill="#475569">앱에서 지도를 다시 만든다</text></g><text x="400" y="344" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">삼성전자서비스 «충전복귀가 되지 않아 자동 충전이 안 돼요»(2026-10-15) 기준 — 모델마다 버튼 이름이 다르다</text></svg>