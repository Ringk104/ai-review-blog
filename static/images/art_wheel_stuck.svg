<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">바퀴 쪽 증상 읽기</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="90" cy="116" r="22" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="90" cy="105" r="7" fill="#1E293B"/><path d="M90,92 q10,-40 60,-46" stroke="#2563EB" stroke-width="3" fill="none" stroke-dasharray="6 5"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">한쪽으로 휘어 간다</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">구동 바퀴 이물일 수 있다(삼성)</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="100" cy="104" r="26" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="100" cy="91" r="8" fill="#1E293B"/><rect x="136" y="46" width="60" height="26" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><path d="M146,56 h40 M146,63 h26" stroke="#2563EB" stroke-width="2"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">«바퀴를 확인해 주세요»</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">빠졌거나 이물이 감겼다(로보킹)</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><path d="M110,56 q10,8 0,16 q-10,8 0,16 q10,8 0,16 q-10,8 0,16" stroke="#1E293B" stroke-width="4" fill="none"/><path d="M146,80 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">돌 때 나는 소리</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">바퀴 스프링 소리는 정상(로보킹)</text></g></svg>