<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">앞바퀴 — 빼서 헹구고, 축에 기름 두 방울 이하</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="70" y="40" width="100" height="56" rx="10" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="110" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="110" r="7" fill="#1E293B"/><path d="M40,150 l44,-40" stroke="#475569" stroke-width="6" stroke-linecap="round"/><path d="M84,110 l6,-6" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/><path d="M176,118 v-34 m-9,9 l9,-9 l9,9" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">① 틈에 넣어 천천히 빼기</text><text x="120" y="228" text-anchor="middle" font-size="14" fill="#475569">틀(브래킷)은 빼지 않기</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="100" cy="106" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="128" y="102" width="60" height="8" rx="3" fill="#475569"/><path d="M80,40 q4,10 0,16 M100,34 q4,12 0,20 M120,40 q4,10 0,16" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/><text x="120" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">② 물로 헹궈 말리기</text><text x="120" y="228" text-anchor="middle" font-size="14" fill="#475569">머리카락·먼지 없애기</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="40" y="102" width="150" height="10" rx="4" fill="#475569"/><circle cx="96" cy="107" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3" opacity="0.5"/><path d="M160,40 q12,18 0,30 q-12,-12 0,-30 z" fill="#F59E0B" stroke="#1E293B" stroke-width="2"/><path d="M160,78 q8,10 0,16 q-8,-6 0,-16 z" fill="#F59E0B" stroke="#1E293B" stroke-width="2"/><text x="196" y="66" font-size="18" font-weight="800" fill="#1E293B">×2</text><text x="120" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1E293B">③ 축에 올리브유</text><text x="120" y="228" text-anchor="middle" font-size="14" fill="#475569">두 방울 이하, 돌려서 고루</text></g></svg>