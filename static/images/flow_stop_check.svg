<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="330" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">청소 중에 자꾸 멈출 때 — 이 순서로</text>
<g transform="translate(24,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">1</text>
<circle cx="110" cy="92" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="110" cy="77" r="10" fill="#1E293B"/><circle cx="150" cy="56" r="14" fill="#EF4444"/><text x="150" y="62" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">!</text>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">멈춘 자리</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">먼저 보기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">끼임·걸림·바퀴 들림</text></g>
<g transform="translate(216,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">2</text>
<circle cx="100" cy="90" r="34" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="60" y="82" width="12" height="16" rx="4" fill="#1E293B"/><rect x="128" y="82" width="12" height="16" rx="4" fill="#1E293B"/><circle cx="100" cy="66" r="5" fill="#475569"/><path d="M58,90 q-8,10 0,20 M62,82 q12,8 0,24" stroke="#EF4444" stroke-width="2" fill="none"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">바퀴에 감긴</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">이물 빼기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">먼지통 빼고 뒤집기</text></g>
<g transform="translate(408,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">3</text>
<circle cx="100" cy="92" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="100" cy="77" r="10" fill="#1E293B"/><circle cx="146" cy="70" r="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><path d="M152,78 l14,14" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">센서 닦기</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B"></text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">제자리 회전·후진할 때</text></g>
<g transform="translate(600,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">4</text>
<circle cx="96" cy="92" r="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="96" cy="77" r="10" fill="#1E293B"/><path d="M146,60 a22,22 0 1,1 -4,30" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M138,84 l4,8 l8,-4" stroke="#2563EB" stroke-width="4" fill="none"/>
<text x="16" y="156" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">오류 알림이면</text><text x="16" y="184" text-anchor="start" font-size="20" font-weight="800" fill="#1E293B">껐다 켜기</text><text x="16" y="214" text-anchor="start" font-size="15" font-weight="400" fill="#475569">앱에서 오류 해결</text></g>
</svg>