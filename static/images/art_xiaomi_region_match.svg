<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="400" rx="20" fill="#EFF6FF"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">앱 지역은 «기기를 산 지역»에 맞춘다</text>
<g transform="translate(70,84)"><rect width="250" height="220" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
<rect x="80" y="26" width="90" height="70" rx="8" fill="#F1F5F9" stroke="#1E293B" stroke-width="3"/><path d="M80,48 h90" stroke="#1E293B" stroke-width="3"/><circle cx="125" cy="72" r="12" fill="none" stroke="#2563EB" stroke-width="4"/><path d="M118,72 l5,5 l9,-10" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
<text x="125" y="146" text-anchor="middle" font-size="24" font-weight="800" fill="#1E293B">기기를 산 지역</text><text x="125" y="182" text-anchor="middle" font-size="18" fill="#475569">해외 제품은 산 곳부터 확인</text></g>
<text x="400" y="206" text-anchor="middle" font-size="64" font-weight="800" fill="#2563EB">=</text>
<g transform="translate(480,84)"><rect width="250" height="220" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
<rect x="95" y="16" width="60" height="100" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><rect x="105" y="40" width="40" height="10" rx="5" fill="#CBD5E1"/><rect x="105" y="58" width="40" height="10" rx="5" fill="#2563EB"/><rect x="105" y="76" width="40" height="10" rx="5" fill="#CBD5E1"/>
<text x="125" y="146" text-anchor="middle" font-size="24" font-weight="800" fill="#1E293B">앱의 지역 설정</text><text x="125" y="182" text-anchor="middle" font-size="18" fill="#475569">프로필 → 설정 → 지역</text></g>
<text x="400" y="352" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">다르면 기기 추가가 막힐 수 있다</text></svg>
