<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="302" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text x="24" y="36" font-size="19" font-weight="700" fill="#1E293B">삼성 자주 보고되는 문제 요약</text><rect x="24" y="70" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 81 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="86" font-size="15" fill="#1E293B">맵핑 오류 및 방 인식 실패 (빙글빙글 회전) — 약 25%</text><rect x="24" y="116" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 127 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="132" font-size="15" fill="#1E293B">청소 중 갑자기 멈춤 (작동 중단) — 약 20%</text><rect x="24" y="162" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 173 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="178" font-size="15" fill="#1E293B">세척조 오류 (오수통 가득참 알림) — 약 18%</text><rect x="24" y="208" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 219 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="224" font-size="15" fill="#1E293B">물걸레 냄새 및 청소 후 얼룩 — 약 15%</text><rect x="24" y="254" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 265 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="270" font-size="15" fill="#1E293B">충전 불량 및 배터리 방전 — 약 12%</text></svg>