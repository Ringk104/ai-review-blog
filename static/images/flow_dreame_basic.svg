<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="470" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">드리미가 이상하면 — 먼저 이 순서로</text>
<g transform="translate(30,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<rect x="250" y="26" width="64" height="104" rx="4" fill="#F1F5F9" stroke="#1E293B" stroke-width="3"/><path d="M250,26 l-34,14 v104 l34,-14 z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><circle cx="226" cy="90" r="4" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">전선·슬리퍼</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">치우고 문 열기</text><text x="24" y="164" font-size="18" fill="#475569">청소할 방의 문을 연다</text></g>
<g transform="translate(420,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<rect x="210" y="120" width="124" height="10" rx="3" fill="#CBD5E1"/><ellipse cx="290" cy="120" rx="36" ry="6" fill="#38BDF8" opacity="0.7"/><path d="M262,40 q-10,16 0,22 q10,-6 0,-22 z" fill="#38BDF8"/><path d="M300,56 q-10,16 0,22 q10,-6 0,-22 z" fill="#38BDF8"/><circle cx="240" cy="104" r="15" fill="#1E293B"/><path d="M262,104 h20 M268,96 h14" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">바닥이</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">젖어 있지 않나?</text><text x="24" y="164" font-size="18" fill="#475569">젖으면 바퀴가 미끄러진다</text></g>
<g transform="translate(30,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<circle cx="276" cy="80" r="50" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M234,52 a50,50 0 0 1 84,0" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/><rect x="258" y="34" width="36" height="12" rx="4" fill="#2563EB"/><rect x="290" y="12" width="44" height="30" rx="8" fill="#FDE68A" stroke="#B45309" stroke-width="2" transform="rotate(14 312 27)"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">범퍼 창·센서</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">닦기</text><text x="24" y="164" font-size="18" fill="#475569">라인 레이저 센서, 부드러운 천으로</text></g>
<g transform="translate(420,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<rect x="228" y="22" width="104" height="116" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><rect x="238" y="32" width="38" height="50" rx="6" fill="#E0F2FE" stroke="#1E293B" stroke-width="2"/><rect x="241" y="52" width="32" height="27" rx="4" fill="#38BDF8"/><rect x="284" y="32" width="38" height="50" rx="6" fill="#F1F5F9" stroke="#1E293B" stroke-width="2"/><rect x="287" y="62" width="32" height="17" rx="4" fill="#94A3B8"/><rect x="238" y="108" width="84" height="16" rx="4" fill="#F1F5F9" stroke="#2563EB" stroke-width="3"/><path d="M250,108 v16 M262,108 v16 M274,108 v16 M286,108 v16 M298,108 v16 M310,108 v16" stroke="#2563EB" stroke-width="2"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">스테이션은</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">오수통부터</text><text x="24" y="164" font-size="18" fill="#475569">세척판 필터·먼지 봉투도</text></g></svg>
