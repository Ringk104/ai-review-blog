<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="470" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">앱에서 «오프라인»일 때 — 이 순서로 보세요</text>
<g transform="translate(30,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<path d="M266,80 v-26 M314,80 v-26" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/><rect x="250" y="80" width="80" height="44" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><circle cx="274" cy="102" r="5" fill="#2563EB"/><circle cx="292" cy="102" r="5" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">공유기·비밀번호를</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">바꿨나?</text><text x="24" y="164" font-size="18" fill="#475569">그렇다면 지우고 다시 등록</text></g>
<g transform="translate(420,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<path d="M276,58 A20,20 0 0 1 304,58" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M264,46 A38,38 0 0 1 316,46" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
<rect x="296" y="72" width="40" height="60" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><rect x="236" y="104" width="70" height="28" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">도크 자리에</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">신호가 닿나?</text><text x="24" y="164" font-size="18" fill="#475569">쉬는 동안은 도크에 있다</text></g>
<g transform="translate(30,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<rect x="262" y="40" width="56" height="96" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><rect x="270" y="52" width="40" height="66" rx="4" fill="#E0F2FE"/><path d="M290,108 v-38" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><path d="M290,62 l-10,14 h20 z" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">앱 최신 버전,</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">로봇 다시 시작</text><text x="24" y="164" font-size="18" fill="#475569">공장 초기화는 마지막에</text></g>
<g transform="translate(420,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<path d="M318,96 A32,32 0 1 1 300,67" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><path d="M296,54 l18,12 l-18,12 z" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">와이파이 재설정</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">→ 새 기기로 추가</text><text x="24" y="164" font-size="18" fill="#475569">누르는 버튼은 모델마다 다르다</text></g></svg>
