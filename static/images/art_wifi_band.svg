<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">로봇청소기는 2.4GHz 와이파이에 연결</text>
<text x="400" y="80" text-anchor="middle" font-size="20" fill="#475569">5GHz 와이파이는 지원하지 않는 경우가 많다</text>
<path d="M120,150 v-34 M200,150 v-34" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
<rect x="90" y="150" width="140" height="60" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/><circle cx="125" cy="180" r="6" fill="#2563EB"/><circle cx="150" cy="180" r="6" fill="#2563EB"/><circle cx="175" cy="180" r="6" fill="#94A3B8"/>
<text x="160" y="240" text-anchor="middle" font-size="20" fill="#475569">공유기</text>
<path d="M245,160 C340,130 470,130 560,160" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
<rect x="345" y="112" width="110" height="40" rx="20" fill="#2563EB"/><text x="400" y="139" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">2.4GHz</text>
<path d="M245,200 C340,230 470,230 545,205" fill="none" stroke="#94A3B8" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<rect x="345" y="206" width="110" height="40" rx="20" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="400" y="233" text-anchor="middle" font-size="20" font-weight="800" fill="#94A3B8">5GHz</text>
<g transform="translate(500,208)"><circle r="16" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/><path d="M-7,-7 l14,14 M7,-7 l-14,14" stroke="#B45309" stroke-width="4" stroke-linecap="round"/></g>
<circle cx="640" cy="180" r="70" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/><circle cx="640" cy="160" r="16" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><path d="M590,206 h100" stroke="#1E293B" stroke-width="3"/>
<text x="640" y="280" text-anchor="middle" font-size="20" fill="#475569">로봇청소기</text>
<text x="400" y="326" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">두 대역 이름을 나누면 2.4GHz를 고르기 쉽다</text></svg>
