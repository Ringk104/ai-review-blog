<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="330" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">아래층이 신경 쓰인다면 — 이 순서로</text>
<g transform="translate(24,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">1</text>
<circle cx="104" cy="84" r="38" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M104,84 v-24 M104,84 l18,10" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/><path d="M104,46 a38,38 0 0 1 36,26" fill="none" stroke="#2563EB" stroke-width="6"/>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">예약은 낮에</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">06~22시</text><text x="16" y="214" font-size="15" fill="#475569">야간은 22~06시</text></g>
<g transform="translate(216,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">2</text>
<path d="M120,50 a34,34 0 1 0 22,60 a28,28 0 1 1 -22,-60 z" fill="#1E293B"/><text x="64" y="72" font-size="18" font-weight="800" fill="#2563EB">Z</text><text x="50" y="96" font-size="14" font-weight="800" fill="#2563EB">z</text>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">방해 금지</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">모드 시간 확인</text><text x="16" y="214" font-size="15" fill="#475569">먼지 비움·재개 멈춤</text></g>
<g transform="translate(408,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">3</text>
<rect x="44" y="62" width="120" height="12" rx="6" fill="#E2E8F0"/><rect x="44" y="62" width="50" height="12" rx="6" fill="#2563EB"/><circle cx="94" cy="68" r="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><text x="44" y="104" font-size="13" font-weight="700" fill="#2563EB">조용</text><text x="134" y="104" font-size="13" font-weight="700" fill="#94A3B8">터보</text>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">흡입력은</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">조용·표준으로</text><text x="16" y="214" font-size="15" fill="#475569">카펫 자동 터보 확인</text></g>
<g transform="translate(600,72)"><rect width="176" height="236" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="30" cy="30" r="19" fill="#2563EB"/><text x="30" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">4</text>
<path d="M56,70 h18 l24,-20 v68 l-24,-20 h-18 z" fill="#CBD5E1" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/><path d="M112,62 l30,30 M142,62 l-30,30" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
<text x="16" y="156" font-size="20" font-weight="800" fill="#1E293B">음성 줄이고</text><text x="16" y="184" font-size="20" font-weight="800" fill="#1E293B">먼지 비움은 낮에</text><text x="16" y="214" font-size="15" fill="#475569">앱·리모컨 음소거</text></g>
</svg>
