<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="470" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">주황색으로 깜박이며 멈췄다면 — 이 순서로</text>
<g transform="translate(30,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<rect x="244" y="20" width="64" height="112" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><rect x="252" y="40" width="48" height="26" rx="5" fill="#FED7AA" stroke="#F97316" stroke-width="2"/><path d="M258,80 h36 M258,92 h28 M258,104 h32" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/><path d="M318,52 q10,10 0,20 M326,44 q18,18 0,36" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">앱 알림·음성</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">안내 확인</text><text x="24" y="164" font-size="18" fill="#475569">무엇이 문제인지 본다</text></g>
<g transform="translate(420,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<rect x="226" y="24" width="108" height="108" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M226,51 h108 M226,78 h108 M226,105 h108 M266,24 v108" stroke="#94A3B8" stroke-width="2"/><rect x="228" y="80" width="104" height="23" fill="#2563EB" opacity="0.25"/><rect x="226" y="78" width="108" height="27" fill="none" stroke="#2563EB" stroke-width="3"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">같은 증상 찾아</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">청소·정리</text><text x="24" y="164" font-size="18" fill="#475569">아래 표에서</text></g>
<g transform="translate(30,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<path d="M256,46 a40,40 0 1 0 44,0" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/><path d="M278,28 v44" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">껐다가</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">다시 켠다</text><text x="24" y="164" font-size="18" fill="#475569">오작동할 때 첫 조치</text></g>
<g transform="translate(420,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<path d="M232,30 h96 a12,12 0 0 1 12,12 v52 a12,12 0 0 1 -12,12 h-56 l-22,20 v-20 h-18 a12,12 0 0 1 -12,-12 v-52 a12,12 0 0 1 12,-12 z" fill="#E0F2FE" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/><circle cx="254" cy="68" r="6" fill="#2563EB"/><circle cx="280" cy="68" r="6" fill="#2563EB"/><circle cx="306" cy="68" r="6" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">계속되면</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">고객지원</text><text x="24" y="164" font-size="18" fill="#475569">같은 문제가 반복될 때</text></g></svg>
