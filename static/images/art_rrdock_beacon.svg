<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="340" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">신호를 가리는 것 치우고, 신호부와 센서 닦기</text>
<rect x="70" y="96" width="110" height="150" rx="14" fill="#CBD5E1" stroke="#1E293B" stroke-width="4"/><rect x="90" y="196" width="70" height="20" rx="6" fill="#1E293B"/><rect x="60" y="246" width="130" height="14" rx="5" fill="#94A3B8" stroke="#1E293B" stroke-width="3"/><path d="M196,222 c8,-30 72,-30 80,0 c4,18 -84,18 -80,0 z" fill="#FCA5A5" stroke="#1E293B" stroke-width="3"/><text x="252" y="186" text-anchor="middle" font-size="15" fill="#475569">슬리퍼·걸레·커튼</text><path d="M290,104 l34,34 M324,104 l-34,34" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/><text x="200" y="304" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">신호가 막히면 도크를 못 찾음</text><rect x="450" y="96" width="110" height="150" rx="14" fill="#CBD5E1" stroke="#1E293B" stroke-width="4"/><rect x="470" y="196" width="70" height="20" rx="6" fill="#1E293B"/><rect x="440" y="246" width="130" height="14" rx="5" fill="#94A3B8" stroke="#1E293B" stroke-width="3"/><path d="M570,206 q18,-12 0,-24 M582,216 q34,-24 0,-48" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="700" cy="196" r="44" fill="#CBD5E1" stroke="#1E293B" stroke-width="4"/><rect x="658" y="184" width="16" height="24" rx="4" fill="#1E293B"/><path d="M476,150 l44,-14 l10,28 l-44,14 z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><text x="580" y="112" font-size="15" fill="#475569">마른 천</text><path d="M676,118 l40,-12 l8,24 l-40,12 z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><text x="600" y="304" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">도크 신호부·로봇 앞 센서를 마른 천으로</text></svg>