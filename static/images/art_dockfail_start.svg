<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="360" rx="20" fill="#EFF6FF"/>
<text x="400" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">청소는 충전대에서 시작해야 돌아오기 쉽다</text>
<g transform="translate(24,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="98" y="40" width="44" height="58" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="54" r="5" fill="#2563EB"/><circle cx="120" cy="128" r="22" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="120" cy="117" r="7" fill="#1E293B"/><path d="M120,104 v-4" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M170,48 l8,9 l18,-20" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">충전대에서 출발</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">위치를 기억하고 돌아온다</text></g><g transform="translate(280,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="40" y="36" width="160" height="120" rx="6" fill="none" stroke="#475569" stroke-width="4"/><circle cx="170" cy="130" r="16" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="170" cy="122" r="5" fill="#1E293B"/><path d="M54,140 v-90 h130 v70" stroke="#2563EB" stroke-width="3" fill="none" stroke-dasharray="6 6"/><rect x="56" y="46" width="30" height="36" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="71" cy="60" r="5" fill="#2563EB"/><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">다른 곳에서 출발</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">청소 뒤 벽을 따라 충전대를 찾는다</text></g><g transform="translate(536,76)"><rect width="240" height="260" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><rect x="40" y="70" width="44" height="58" rx="8" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="62" cy="84" r="5" fill="#2563EB"/><circle cx="186" cy="98" r="20" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/><circle cx="186" cy="88" r="6" fill="#1E293B"/><path d="M90,98 h72" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 6"/><text x="126" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#2563EB">5m+</text><text x="120" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#1E293B">멀리 떨어지면</text><text x="120" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">5m 넘으면 오래 걸릴 수 있다(삼성)</text></g></svg>