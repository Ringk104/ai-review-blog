<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Pretendard, -apple-system, sans-serif"><rect width="800" height="470" rx="20" fill="#EFF6FF"/>
<text x="400" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1E293B">샤오미가 앱에서 안 보일 때 — 이 순서로</text>
<g transform="translate(30,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<circle cx="292" cy="80" r="34" fill="none" stroke="#2563EB" stroke-width="4"/><path d="M258,80 h68 M292,46 v68" stroke="#2563EB" stroke-width="3"/><ellipse cx="292" cy="80" rx="15" ry="34" fill="none" stroke="#2563EB" stroke-width="3"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">앱 지역 =</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">기기를 산 지역</text><text x="24" y="164" font-size="18" fill="#475569">프로필 → 설정 → 지역</text></g>
<g transform="translate(420,70)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<rect x="232" y="44" width="100" height="40" rx="20" fill="#2563EB"/><text x="282" y="71" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">2.4GHz</text>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">2.4GHz 와이파이</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">이름·비밀번호 확인</text><text x="24" y="164" font-size="18" fill="#475569">특수문자·한자가 없는지</text></g>
<g transform="translate(30,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<g transform="translate(14,0)"><rect x="262" y="34" width="58" height="96" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M280,62 l20,16 l-10,8 v-32 l10,8 l-20,16" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><path d="M291,96 c-10,0 -14,8 -14,12 c0,8 14,18 14,18 c0,0 14,-10 14,-18 c0,-4 -4,-12 -14,-12 z" fill="#2563EB"/></g>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">블루투스·위치 켜고</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">앱 권한 허용</text><text x="24" y="164" font-size="18" fill="#475569">위치·저장공간·백그라운드</text></g>
<g transform="translate(420,270)"><rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/><circle cx="34" cy="34" r="20" fill="#2563EB"/><text x="34" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<rect x="276" y="40" width="50" height="84" rx="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/><path d="M286,76 A16,16 0 0 1 316,76" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M276,62 A30,30 0 0 1 326,62" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><circle cx="301" cy="88" r="5" fill="#2563EB"/>
<text x="24" y="100" font-size="24" font-weight="800" fill="#1E293B">다른 휴대폰</text><text x="24" y="132" font-size="24" font-weight="800" fill="#1E293B">핫스팟으로 시험</text><text x="24" y="164" font-size="18" fill="#475569">되면 집 공유기 설정 문제</text></g>
</svg>
