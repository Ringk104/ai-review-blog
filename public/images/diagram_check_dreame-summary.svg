<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="302" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text x="24" y="36" font-size="19" font-weight="700" fill="#1E293B">드리미 자주 보고되는 문제 요약</text><rect x="24" y="70" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 81 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="86" font-size="15" fill="#1E293B">청소 시간이 예상보다 오래 걸림 — 약 25%</text><rect x="24" y="116" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 127 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="132" font-size="15" fill="#1E293B">물걸레 패드 탈착 오류 또는 걸레 빠짐 — 약 20%</text><rect x="24" y="162" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 173 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="178" font-size="15" fill="#1E293B">맵핑 오류 또는 방 구분 인식 실패 — 약 18%</text><rect x="24" y="208" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 219 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="224" font-size="15" fill="#1E293B">물걸레 쉰내 또는 열풍 건조 부족 — 약 15%</text><rect x="24" y="254" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 265 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="270" font-size="15" fill="#1E293B">배수 호스 길이 문제 또는 직배수 설치 오류 — 약 12%</text></svg>