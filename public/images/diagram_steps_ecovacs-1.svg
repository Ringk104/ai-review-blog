<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="466" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">물걸레에서 퀴퀴한 냄새 발생 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="95" font-size="15" fill="#1E293B">오수통을 분리해 흐르는 물로 내부를 완전히 헹구고 건조</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="173" font-size="15" fill="#1E293B">물걸레 롤러를 분리해 세탁기 또는 손세탁 후 햇볕에 완전 건조</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="241" font-size="15" fill="#1E293B">앱에서 '열풍 건조' 기능을 '매 청소 후 자동 작동'으로 설</text><text x="108" y="261" font-size="15" fill="#1E293B">정</text><line x1="52" y1="348" x2="52" y2="378" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="319" font-size="15" fill="#1E293B">세제 투입구에 세제가 남아 있는지 확인하고, 없다면 보충 후 </text><text x="108" y="339" font-size="15" fill="#1E293B">재작동</text><circle cx="52" cy="402" r="20" fill="#2563EB"/><text x="52" y="408" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="88" y="378" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="397" font-size="15" fill="#1E293B">1주일에 한 번 오수통과 청수통을 식초물(1:10)로 세척해 </text><text x="108" y="417" font-size="15" fill="#1E293B">냄새 예방</text></svg>