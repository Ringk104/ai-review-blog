<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="388" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">문턱(2cm 이상) 넘기 실패 및 복귀 불가 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="85" font-size="15" fill="#1E293B">문턱 높이가 2cm 이상이면 실리콘 경사판(온라인 구매 가능)</text><text x="108" y="105" font-size="15" fill="#1E293B"> 부착</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="163" font-size="15" fill="#1E293B">Mi Home 앱 → 맵 편집 → 가상벽 또는 금지구역 설정으</text><text x="108" y="183" font-size="15" fill="#1E293B">로 문턱 구역 차단</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="251" font-size="15" fill="#1E293B">청소 시작 전 배터리 잔량 80% 이상 확인</text><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="329" font-size="15" fill="#1E293B">문턱 통과 실패가 반복되면 해당 구역은 수동 청소로 대체</text></svg>