<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="544" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">특정 구역을 청소하지 않거나 건너뜀 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="95" font-size="15" fill="#1E293B">앱 내 '지도 관리'에서 현재 지도를 삭제하고 초기화</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="163" font-size="15" fill="#1E293B">로봇청소기를 스테이션에 두고 '전체 청소' 실행 → 집 전체를</text><text x="108" y="183" font-size="15" fill="#1E293B"> 한 바퀴 돌며 재매핑</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="251" font-size="15" fill="#1E293B">매핑 완료 후 앱에서 각 방 이름 지정 및 구역 경계 확인</text><line x1="52" y1="348" x2="52" y2="378" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="319" font-size="15" fill="#1E293B">'금지 구역', '물걸레 금지 구역' 설정이 잘못 지정되지 않</text><text x="108" y="339" font-size="15" fill="#1E293B">았는지 재확인</text><line x1="52" y1="426" x2="52" y2="456" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="402" r="20" fill="#2563EB"/><text x="52" y="408" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="88" y="378" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="397" font-size="15" fill="#1E293B">특정 구역만 청소 안 되면 해당 구역을 앱에서 선택 → '구역</text><text x="108" y="417" font-size="15" fill="#1E293B"> 청소' 수동 실행</text><circle cx="52" cy="480" r="20" fill="#2563EB"/><text x="52" y="486" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="88" y="456" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="485" font-size="15" fill="#1E293B">가구 배치 변경 시 '지도 업데이트' 기능 사용 또는 재매핑</text></svg>