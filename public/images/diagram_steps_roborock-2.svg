<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="388" rx="16" fill="#F8FAFC"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1E293B">와이파이 연결 실패 (앱 연동 오류) 해결 순서</text><line x1="52" y1="114" x2="52" y2="144" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="90" r="20" fill="#2563EB"/><text x="52" y="96" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="88" y="66" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="85" font-size="15" fill="#1E293B">공유기 설정에서 2.4GHz 대역 확인 (5GHz와 SSID </text><text x="108" y="105" font-size="15" fill="#1E293B">분리 권장)</text><line x1="52" y1="192" x2="52" y2="222" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="168" r="20" fill="#2563EB"/><text x="52" y="174" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="88" y="144" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="173" font-size="15" fill="#1E293B">SSID 숨김 해제, MAC 주소 필터·방화벽 임시 비활성화</text><line x1="52" y1="270" x2="52" y2="300" stroke="#DBEAFE" stroke-width="3"/><circle cx="52" cy="246" r="20" fill="#2563EB"/><text x="52" y="252" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="88" y="222" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="241" font-size="15" fill="#1E293B">Roborock 앱 최신 버전 설치, 스마트폰 블루투스·위치 </text><text x="108" y="261" font-size="15" fill="#1E293B">권한 활성화</text><circle cx="52" cy="324" r="20" fill="#2563EB"/><text x="52" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="88" y="300" width="528" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="108" y="319" font-size="15" fill="#1E293B">앱에서 '기기 추가' → 청소기 리셋 버튼 3초 누른 뒤 안내</text><text x="108" y="339" font-size="15" fill="#1E293B">에 따라 재연결</text></svg>