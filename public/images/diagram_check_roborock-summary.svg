<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" font-family="Pretendard, -apple-system, sans-serif"><rect width="640" height="302" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text x="24" y="36" font-size="19" font-weight="700" fill="#1E293B">로보락 자주 보고되는 문제 요약</text><rect x="24" y="70" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 81 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="86" font-size="15" fill="#1E293B">오류 메시지 (오류 56, 43, 106 등) 반복 발생 — 약 15~20%</text><rect x="24" y="116" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 127 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="132" font-size="15" fill="#1E293B">와이파이 연결 실패 (앱 연동 오류) — 약 10~15%</text><rect x="24" y="162" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 173 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="178" font-size="15" fill="#1E293B">물걸레 및 도크 악취·곰팡이 — 약 10~12%</text><rect x="24" y="208" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 219 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="224" font-size="15" fill="#1E293B">충전 불량 (도킹 실패, 배터리 오류) — 약 8~10%</text><rect x="24" y="254" width="22" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M29 265 l4 4 l8 -9" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="60" y="270" font-size="15" fill="#1E293B">장애물 회피 성능 부족 (충돌, 감김) — 약 8~10%</text></svg>